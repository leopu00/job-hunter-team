# Job Hunter Team — Runtime container (production / utenti finali)
#
# Questo compose e' il default per chi installa JHT via:
#   curl -fsSL https://jobhunterteam.ai/install.sh | bash
#
# install.sh scarica questo file nel runtime host protetto fuori da ~/.jht.
# Il wrapper bash ~/.local/bin/jht lo usa per docker compose up/down/exec.
#
# Image-only: nessun bind dei sorgenti, nessun `build:`. Tutto cio' che
# serve sta dentro l'immagine GHCR. Per il dev mode con hot-reload usa
# docker-compose.dev.yml (override) — vedi commento in fondo al file.
#
# Stato persistente: bind-mount di ~/.jht (config nascosta) e
# ~/Documents/Job Hunter Team (CV e output visibili).

services:
  jht:
    # Override via env var: JHT_IMAGE=ghcr.io/leopu00/jht:dev-1 jht upgrade
    # Utile per testare immagini di branch dev prima del merge a master.
    # Il default release e' content-addressed: reinstallare la stessa versione
    # non puo' risolvere byte diversi se il tag semver viene spostato.
    image: &jht-image ${JHT_IMAGE:-ghcr.io/leopu00/jht@sha256:b48f45f4d3d6313768a3fb7ff56d0b9db4470440f1e2110e335f4290f4d9eb1c}
    container_name: jht
    # Override del CMD Dockerfile (--help): entry point `pid1` che
    # in base a JHT_HOST_TYPE dispatch tra:
    #   - vps  + cloud paired → `cloud daemon` (push loop verso prod)
    #   - vps  no cloud       → bridges + watchdog (daemon parte al pairing)
    #   - local               → bridges + watchdog
    # Niente dashboard web locale (ritirata 2026-07-23): l'interazione
    # local/VPS passa dall'app desktop via docker exec / SSH; il browser
    # serve solo il cloud (jobhunterteam.ai, con login).
    # Vedi cli/src/commands/pid1.js per dettagli.
    command: ["pid1"]
    environment:
      # HOME points at the bind-mounted /jht_home so CLI credential
      # files (~/.claude, ~/.codex, ~/.kimi) land on the host disk
      # and persist across container recreation.
      - HOME=/jht_home
      - JHT_HOME=/jht_home
      - JHT_USER_DIR=/jht_user
      # The live screen is the jht-screen container, not a process of pid1 (cli/src/commands/pid1.js).
      - JHT_LIVE_SCREEN_EXTERNAL=1
      # JHT_HOST_TYPE letto da pid1 dispatcher. Default `local` per
      # backwards-compat: solo VPS via host-setup.sh setta esplicitamente
      # `vps` in ~/.jht/host.env (montato come /jht_home/host.env).
      - JHT_HOST_TYPE=${JHT_HOST_TYPE:-}
      # JHT_LANG (en|it) — scelto dall'utente al primo run del wizard.
      # I componenti che hanno bisogno della lingua (wizard, futuri
      # messaggi degli agenti, dashboard intelligence) leggono questa.
      # NB: `JHT_LANG` e' la lingua del PRODOTTO, `LANG` (sotto) e' la locale
      # di SISTEMA. Due cose diverse: il nome che le contiene entrambe inganna.
      - JHT_LANG=${JHT_LANG:-en}
      # LANG — locale di SISTEMA del container. Senza, glibc deriva
      # LC_CTYPE="POSIX" e chi si attacca a un pane da fuori
      # (`docker exec -it jht tmux attach`) vede `_` al posto di ogni
      # lettera accentata: tmux, non sapendosi in UTF-8, rende la coppia di
      # byte come due caratteri non stampabili. I DATI restano sani (nel
      # buffer la «e» accentata e' 0xC3 0xA8), e' solo rendering del client
      # — ma un pane illeggibile e' un pane che nessuno legge. L'immagine ha
      # gia' `C.utf8` in `locale -a`: qui non si installa niente, si nomina.
      # Non e' hardcodato it/en apposta: C.UTF-8 e' neutra e vale per tutte
      # e 7 le lingue del prodotto (misurato il 2026-08-10, O-38).
      - LANG=C.UTF-8
      # Bug #15: timezone utente (IANA, es. Europe/Rome, Asia/Shanghai).
      # Chiesta nel setup wizard (host-setup.sh), salvata in
      # ~/.jht/host.env. Default UTC: niente assunzione geografica
      # (utenti in CN/US/EU/AU). Letta da format_time skill per
      # convertire timestamp nei messaggi Telegram/grafici user-facing.
      - JHT_USER_TZ=${JHT_USER_TZ:-UTC}
      # IS_CONTAINER=1 abilita il passthrough in cli/src/utils/container-proxy.js:
      # le funzioni che oggi farebbero `docker exec jht ...` eseguono
      # comandi locali (siamo gia' nel posto giusto). Vedi
      # docs/internal/vps.md.
      - IS_CONTAINER=1
      # Deroga dell'operatore quando `$JHT_HOME/data/` non è scrivibile
      # (issue #132): l'UNICO fallback ammesso per il database di
      # coordinamento Scout, e unico proprio perché sta nell'ambiente che
      # arriva a tutti gli agenti. Senza questa riga resterebbe sull'host e
      # nel container non esisterebbe. Vuota = nessuna deroga (il codice
      # tratta la stringa vuota come assente).
      - JHT_SCOUT_COORD_DB=${JHT_SCOUT_COORD_DB:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      # NB: nonostante il prefisso NEXT_PUBLIC_, queste due NON servono a
      # Next (che qui non gira): le legge il sync del container —
      # shared/skills/db_to_supabase.py e `jht doctor` — come fallback
      # quando la config non arriva da ~/.jht/cloud.json. Non rimuoverle.
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      # [JHT-DASHBOARD-SPLIT] Deploy-mode DURO deciso a build/deploy. Il
      # container (PC locale o VPS via tunnel SSH) è sempre CO-LOCATO col team
      # → 'local': SQLite source-of-truth, scrittura piena. Solo il deploy
      # Vercel imposta 'cloud' (sola lettura + corsia richieste). Default
      # 'local' anche se l'env manca (vedi web/lib/deploy-mode.ts).
      - NEXT_PUBLIC_JHT_DEPLOY=${NEXT_PUBLIC_JHT_DEPLOY:-local}
      # ── CLI dei provider FUORI dal bind-mount ────────────────────────
      # Su Windows /jht_home e' C:\ visto attraverso WSL2: scrivere li'
      # dentro costa ~158x piu' che sul disco del container (misurato su
      # T440s: 200 file piccoli = 11.209 ms contro 71 ms). npm e uv creano
      # decine di migliaia di file minuscoli, ed e' esattamente il caso
      # peggiore: installare un CLI passava da mezzo minuto (Linux) a
      # un'attesa interminabile (Windows). Su Linux e macOS il mount e'
      # locale e non cambia nulla.
      # /opt/jht-deps e' gia' il prefisso scrivibile degli agenti ed e'
      # ora un volume: i CLI installati sopravvivono alla ricreazione del
      # container come facevano nel bind-mount.
      - NPM_CONFIG_PREFIX=/opt/jht-deps/npm-global
      - NPM_CONFIG_CACHE=/opt/jht-deps/npm-cache
      - UV_TOOL_DIR=/opt/jht-deps/uv-tools
      - UV_TOOL_BIN_DIR=/opt/jht-deps/bin
      - UV_CACHE_DIR=/opt/jht-deps/uv-cache
      # Lo stato SQLite di Codex (state, logs, thread_history, goals, memories,
      # queue: WAL, aperti insieme da tutti gli agenti) sta nel volume e non
      # nel bind-mount: su Windows /jht_home e' C:\ attraverso 9p, dove un
      # commit costa ~150x di piu' (3 ms contro 0,02 ms) e l'apertura di Codex
      # trova il database ancora preso da un altro agente ("database is
      # locked"). Restano nel bind, dove l'app e i wrapper li cercano, solo
      # auth.json (il login, uno solo), config.toml, version.json e sessions/.
      # docs/adr/0013-codex-sqlite-state-off-the-host-bind.md
      - CODEX_SQLITE_HOME=/opt/jht-deps/codex-state
      # PATH esplicito: il nuovo prefisso davanti, il vecchio dietro come
      # rete per chi ha gia' i CLI installati nel bind-mount.
      - PATH=/app/agents/_tools:/opt/jht-deps/bin:/opt/jht-deps/npm-global/bin:/opt/jht-deps/python/bin:/jht_home/.npm-global/bin:/jht_home/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games
    volumes:
      - ${HOME}/.jht:/jht_home
      # Mask the legacy host runtime below the broad data bind. The
      # authoritative compose/helpers live outside ~/.jht and are never
      # exposed to the container.
      - jht-runtime-mask:/jht_home/runtime
      - ${HOME}/Documents/Job Hunter Team:/jht_user
      # Volume Docker (dentro la VM su Windows/macOS: veloce), non bind.
      - jht-deps:/opt/jht-deps
      # Il solo volume in comune col broker dei segreti dei portali: il socket.
      # Account della posta e stato del broker stanno in volumi che qui non
      # sono montati (P1 del 08/10). In sola lettura: connect() su un socket
      # unix funziona lo stesso, e gli agenti non possono sostituire il socket
      # né metterci un symlink.
      - jht-broker-sock:/run/jht-broker:ro
      # Il client puo' connettersi al socket Telegram ma non creare/sostituire
      # entry. Gli allegati inbound sono copiabili, mai modificabili in loco.
      - jht-telegram-sock:/run/jht-telegram:ro
      - jht-telegram-inbox:/jht_telegram_inbox:ro
      # The media container (voice notes and photos, on request): the inbox is where jht writes the files to open, the outbox
      # is where the container answers. Opposite modes, as the security opinions ask: jht never writes the answers, the container never
      # writes the questions. Empty volumes while the integration is not there.
      - jht-media-in:/jht_media/in
      - jht-media-out:/jht_media/out:ro
      # The full Chromium of the closer, copied here from the extras image by jht-playwright-populate when the person asks for a tool
      # that needs it. Read-only: the agents cannot change a binary they are about to launch. Empty until then.
      - jht-playwright:/opt/playwright-extras:ro
      # The display of the live screen is the one of the jht-screen container (`jht screen on`): its X socket arrives here through this
      # volume, read-only (connecting to a unix socket works the same), and the closer opens a browser with a window only when the
      # socket is there. Empty while the screen is off.
      - jht-x11:/tmp/.X11-unix:ro
    # Permette allo spike Scorer di raggiungere Ollama/llama.cpp avviato
    # sull'host anche su Docker Engine Linux. L'endpoint resta opt-in e il
    # runner accetta esclusivamente host locali.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No port is published here any more: the stream of the live screen is published by the jht-screen container, on 127.0.0.1 only
    # (the 127.0.0.1 prefix stays: without it the stream would be reachable from the local network).
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Niente privilegi da guadagnare (P1 del 08/10). Il processo e' `jht` e
    # l'immagine non ha sudo; no-new-privileges spegne anche ogni setuid che
    # un pacchetto si porti dietro, e cap_drop ALL toglie le capability che
    # resterebbero a un root nel container. I bind dell'host NON sono
    # nosuid,nodev: con Docker non si puo' (un bind non accetta l'opzione, e il
    # driver local fa il remount solo per ro: moby/sys mount/mounter_linux.go).
    # Il residuo e' un file reso setuid dall'uid 1001 in /jht_home, che gira
    # come 1001, gia' proprietario di ~/.jht. nosuid,nodev arrivano con Podman.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Broker dei segreti dei portali (P1 del 08/10): possiede l'account della
  # posta e fa IMAP e SMTP per conto degli agenti, che gli parlano solo dal
  # socket in jht-broker-sock e ricevono esiti, mai password. Stessa immagine,
  # uid suo (1002), nessun bind dell'host: i segreti stanno in volumi con nome
  # montati solo qui. L'host lo amministra con `exec jht-broker-admin`.
  jht-broker:
    # Non nasce con `jht up`: lo crea `ensure-broker` al primo uso (jht mail setup, il notaio delle candidature,
    # telegram pair). `jht` monta da subito il solo volume vuoto del socket, cosi' il broker arriva senza ricreare `jht`.
    profiles: [broker]
    image: *jht-image
    container_name: jht-broker
    user: "1002:1002"
    entrypoint: ["/usr/bin/tini", "-g", "--", "/usr/local/bin/jht-broker"]
    command: ["serve"]
    environment:
      - LANG=C.UTF-8
      - JHT_BROKER_CLIENT_UID=1001
    volumes:
      - jht-secrets:/jht_secrets
      - jht-broker-state:/jht_broker_state
      - jht-broker-sock:/run/jht-broker
      # The Telegram authorisation socket is absent from jht. Its own volume,
      # rather than a caller-controlled field, separates recording from agents.
      - jht-telegram-broker-sock:/run/jht-broker-telegram
    read_only: true
    # The image declares VOLUME /jht_home and /jht_user: without a mount there,
    # every new broker container gets two anonymous volumes, and a compose
    # down without -v leaves them behind. Empty and read-only, as for
    # jht-telegram: the broker never reads the agents' home.
    tmpfs:
      - /tmp
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jht-telegram:
    profiles: [telegram]
    image: *jht-image
    container_name: jht-telegram
    entrypoint: ["/usr/bin/tini", "-g", "--"]
    command: ["jht-telegram-service"]
    user: "1003:1003"
    # Non entra nella rete Compose degli agenti: il socket e' un volume Unix,
    # mentre l'API Telegram usa solo l'egress del bridge runtime predefinito.
    network_mode: bridge
    environment:
      - LANG=C.UTF-8
      - HOME=/tmp
      - JHT_TELEGRAM_SERVICE_ENABLED=${JHT_TELEGRAM_SERVICE_ENABLED:-0}
      - JHT_TELEGRAM_SECRETS=/jht_telegram_secrets
      - JHT_TELEGRAM_STATE=/jht_telegram_state
      - JHT_TELEGRAM_SOCKET_DIR=/run/jht-telegram
      - JHT_TELEGRAM_INBOX=/jht_telegram_inbox
      - JHT_TELEGRAM_BROKER_SOCKET_DIR=/run/jht-broker-telegram
      - JHT_TELEGRAM_CLIENT_UID=1001
      - JHT_TELEGRAM_BURST_LIMIT=${JHT_TELEGRAM_BURST_LIMIT:-10}
      - JHT_TELEGRAM_DAILY_LIMIT=${JHT_TELEGRAM_DAILY_LIMIT:-300}
    volumes:
      - jht-telegram-secrets:/jht_telegram_secrets
      - jht-telegram-state:/jht_telegram_state
      - jht-telegram-sock:/run/jht-telegram
      - jht-telegram-inbox:/jht_telegram_inbox
      - jht-telegram-broker-sock:/run/jht-broker-telegram
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      # L'immagine comune dichiara questi due VOLUME per jht. Qui li
      # mascheriamo con directory vuote e non scrivibili: non sono ~/.jht.
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # ── Tools the user asks for (profiles: off until `jht integration add`) ──────────────────────────────────────────────────
  # One image (the extras one, by the digest the wrapper carries and exports as JHT_EXTRAS_IMAGE) and one container per tool.
  # No socket of the engine, no capability, no new privileges, the default seccomp profile, a process cap, a memory cap, a
  # root that cannot be written and a tmpfs of fixed size. They start on command and stay off on their own (restart "no"):
  # nothing here comes up at boot. Without the wrapper's pin the image name does not exist, and the profile cannot start.

  # Voice notes to WAV and photos to text, on files nobody has vetted: no network at all, the inbox read-only, the outbox the
  # only place it writes. The worker is shared/media/media_worker.py.
  jht-media:
    profiles: [media]
    image: ${JHT_EXTRAS_IMAGE:-jht-extras-unpinned}
    container_name: jht-media
    user: "1001:1001"
    entrypoint: ["/usr/bin/tini", "-g", "--", "python3", "/app/shared/media/media_worker.py"]
    network_mode: none
    environment:
      - LANG=C.UTF-8
      - HOME=/tmp
    volumes:
      - jht-media-in:/jht_media/in:ro
      - jht-media-out:/jht_media/out
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid
      # The image declares these two VOLUMEs for jht: masked here with empty folders nobody can write, as for jht-telegram.
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # The live screen of the closer, on request (`jht screen on`): Xvfb, x11vnc in view-only and websockify, the three of
  # .launcher/live-screen.sh, in a container of their own. The X socket goes to the volume jht-x11 that jht mounts read-only, and the
  # password of the viewer to ~/.jht/live-screen, where the desktop app reads it. The only port is the stream, on 127.0.0.1.
  # The X socket is visible to every agent of jht, so the stream stays view-only: nobody types a password on this screen.
  jht-screen:
    profiles: [screen]
    image: ${JHT_EXTRAS_IMAGE:-jht-extras-unpinned}
    container_name: jht-screen
    user: "1001:1001"
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/app/.launcher/live-screen.sh"]
    environment:
      - LANG=C.UTF-8
      - HOME=/tmp
      - JHT_LIVE_SCREEN_STATE_DIR=/jht_screen_state
      - JHT_LOGS_DIR=/tmp/logs
    ports:
      - "127.0.0.1:${JHT_LIVE_SCREEN_PORT:-6080}:6080"
    volumes:
      - jht-x11:/tmp/.X11-unix
      - ${HOME}/.jht/live-screen:/jht_screen_state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      # The image declares these two VOLUMEs for jht: masked here with empty folders nobody can write, as for the others.
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # The manual sign-in to LinkedIn (`jht linkedin login`), on request, in three containers of the profile `login` (shared/login/):
  #   jht-login        the browser (Xvfb, openbox, Chromium, x11vnc) on the profile of the person: NO network at all, a display of its own
  #                    that nothing else mounts; it reaches the world only through a socket of the egress folder and the view only through
  #                    a socket of the vnc folder;
  #   jht-login-proxy  the one way out: a CONNECT proxy on a unix socket that lets through a short list of names on port 443. It has the
  #                    network and no profile, no display, no port; it sees bytes of TLS, never what is typed;
  #   jht-login-view   the window onto the browser: the one published port, 127.0.0.1:6081, a token that opens one connection, a session
  #                    of 15 minutes at most. It forwards bytes: it holds no profile and no network of its own beyond the port.
  # The two folders of sockets are volumes mounted by two of the three each, never by jht.
  jht-login:
    profiles: [login]
    image: ${JHT_EXTRAS_IMAGE:-jht-extras-unpinned}
    container_name: jht-login
    user: "1001:1001"
    entrypoint: ["/usr/bin/tini", "-g", "--", "python3", "/app/shared/login/login_session.py", "/ipc/vnc/vnc.sock", "/ipc/egress/proxy.sock", "/ipc/vnc/hint", "/linkedin-profile"]
    network_mode: none
    environment:
      - LANG=C.UTF-8
      - HOME=/tmp
    volumes:
      - jht-login-vnc:/ipc/vnc
      - jht-login-egress:/ipc/egress
      - ${HOME}/.jht/secrets/linkedin-profile:/linkedin-profile
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,nosuid
      # The image declares these two VOLUMEs for jht: masked here with empty folders nobody can write, as for the others.
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The sandbox of Chromium chroots into an empty folder after it makes its own user namespace, and the default seccomp profile lets
    # chroot through only to a container that holds this capability (measured: with every capability dropped the browser dies on its
    # chroot and the sandbox is gone). One capability, in a container with no network, a root that cannot be written and nothing mounted
    # but the profile, is what keeps the sandbox on instead of `--no-sandbox`.
    cap_add:
      - SYS_CHROOT

  jht-login-proxy:
    profiles: [login]
    image: ${JHT_EXTRAS_IMAGE:-jht-extras-unpinned}
    container_name: jht-login-proxy
    user: "1001:1001"
    entrypoint: ["/usr/bin/tini", "-g", "--", "python3", "/app/shared/login/login_proxy.py", "/ipc/egress/proxy.sock"]
    environment:
      - LANG=C.UTF-8
      - HOME=/tmp
    volumes:
      - jht-login-egress:/ipc/egress
    read_only: true
    tmpfs:
      # 32m and not less: the image has 8 MB in its /tmp and an empty tmpfs mounted on it takes a copy of them first
      - /tmp:size=32m,mode=1777,noexec,nosuid
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jht-login-view:
    profiles: [login]
    image: ${JHT_EXTRAS_IMAGE:-jht-extras-unpinned}
    container_name: jht-login-view
    user: "1001:1001"
    entrypoint: ["/usr/bin/tini", "-g", "--", "python3", "/app/shared/login/login_view.py", "serve", "/ipc/vnc/vnc.sock", "/ipc/vnc/hint"]
    environment:
      - LANG=C.UTF-8
      - HOME=/tmp
    ports:
      - "127.0.0.1:6081:6081"
    volumes:
      - jht-login-vnc:/ipc/vnc
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # One-shot, off until it is asked for: copies the full Chromium of the extras image into the volume jht-playwright, the marker last
  # (shared/skills/playwright_extras.py). No network, the volume is the only thing it writes.
  jht-playwright-populate:
    profiles: [playwright]
    image: ${JHT_EXTRAS_IMAGE:-jht-extras-unpinned}
    container_name: jht-playwright-populate
    user: "1001:1001"
    entrypoint: ["/usr/bin/tini", "-g", "--", "python3", "/app/shared/skills/playwright_extras.py", "populate", "${JHT_EXTRAS_DIGEST:-sha256:unset}", "/opt/playwright", "/opt/playwright-extras"]
    network_mode: none
    environment:
      - LANG=C.UTF-8
      - HOME=/tmp
    volumes:
      - jht-playwright:/opt/playwright-extras
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /jht_home:size=64k,mode=0555
      - /jht_user:size=64k,mode=0555
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  jht-deps:
  jht-runtime-mask:
  jht-secrets:
  jht-broker-state:
  jht-broker-sock:
  jht-telegram-broker-sock:
  jht-telegram-secrets:
  jht-telegram-state:
  jht-telegram-sock:
  jht-telegram-inbox:
  jht-media-in:
  jht-media-out:
  jht-playwright:
  jht-x11:
  jht-login-vnc:
  jht-login-egress:


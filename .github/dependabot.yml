version: 2

# `cooldown` su ogni ecosistema: una versione appena pubblicata non si adotta
# lo stesso giorno. E' la finestra in cui un pacchetto compromesso viene
# scoperto e ritirato -- aspettare qualche giorno non costa nulla e toglie di
# mezzo la classe di attacchi che pubblica una release malevola contando
# sull'aggiornamento automatico. Le patch aspettano meno delle major, che
# vanno comunque lette a mano.
#
# Ripetuto per esteso invece che con un'ancora YAML: `dependabot.yml` lo
# interpreta GitHub con uno schema suo, e una configurazione che lui rifiuta
# non fallisce rumorosamente -- semplicemente gli aggiornamenti smettono di
# arrivare, che e' il modo peggiore di rompersi per uno strumento di sicurezza.
#
# Segnalato da zizmor (`dependabot-cooldown`), che dal 2026-07-30 gira nel
# workflow di lint.

updates:
  # Dipendenze web (Next.js, React, TypeScript)
  - package-ecosystem: "npm"
    directory: "/web"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Il runtime e i workflow sono su Node 24: i tipi Node avanzano solo
    # insieme al runtime. ESLint 10 resta bloccato finché eslint-plugin-react
    # (caricato da eslint-config-next) non ne supporta la nuova RuleContext API.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "frontend"

  # Dipendenze test (vitest)
  - package-ecosystem: "npm"
    directory: "/tests/js"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "tests"

  # Dipendenze root
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Docker base image (pinned by SHA in Dockerfile).
  # Dependabot bumps the digest when upstream pushes a new tag.
  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "security"

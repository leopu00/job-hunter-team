name: Windows config ACL gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/install.ps1'
      - 'scripts/jht-wrapper.ps1'
      - 'scripts/windows-config-acl-selftest.ps1'
      - 'scripts/windows-private-acl.ps1'
      - 'scripts/enable-podman-windows-runtime.ps1'
      - 'scripts/configure-podman-windows-network.ps1'
      - 'scripts/podman-machine-bridge.ps1'
      - 'scripts/podman-machine-bridge-selftest.ps1'
      - 'scripts/ci/podman_machine_bridge_gate.ps1'
      - 'scripts/ci/windows_gate_group.ps1'
      - 'scripts/podman-windows-probe.ps1'
      - 'web/public/install.ps1'
      - 'scripts/jht-uninstall-windows.ps1'
      - 'desktop/src-tauri/windows/installer-hooks.nsi'
      # The test files: every one that says «windows», the list of the others (tests/windows_gate_files.py), the files
      # that list names without «windows» in their name, and what the tests stand on.
      - 'tests/test_*windows*.py'
      - 'tests/windows_gate_files.py'
      - 'tests/test_*powershell*.py'
      - 'tests/test_first_start_messages_powershell.py'
      - 'tests/test_installer_core_tier.py'
      - 'tests/test_runtime_volume_migration.py'
      - 'tests/test_setup_help_names_the_key_options.py'
      - 'tests/test_telegram_never_configured.py'
      - 'tests/test_telegram_status_is_read_only.py'
      - 'tests/test_wrapper_desktop_apply.py'
      - 'tests/windows_native_fakes.py'
      - 'tests/conftest.py'
      - 'tests/requirements-ci.txt'
      - 'tests/requirements-windows-gate.txt'
      - '.github/workflows/windows-config-acl.yml'

permissions:
  contents: read

# The gate took 38-49 minutes in one job, one step after the other, and 25-30 of them were the sh-faked tests
# under Windows PowerShell 5.1 (the same tests take 2 minutes under pwsh: each one starts a 5.1 shell, 3-4 s each
# on this runner, and its fakes run under Git for Windows' bash). Seven jobs run side by side, each on its own runner:
#   host    the host ACL selftest, the Podman machine deadline, the native pieces, the start-up measure, the count of
#           what every job must run, and then both groups of tests under pwsh;
#   shells  six slices (tests/conftest.py, JHT_TEST_SLICE=k/6) of both groups under Windows PowerShell 5.1.
# The list of the files is ONE: tests/windows_gate_files.py (every tests/test_*windows*.py is in it by its name). The
# workflow names no test file. Two groups: STRICT (the Podman-in-WSL setup, the app's uninstaller, the long phases: a
# skip fails) and OPEN (every other file meant for Windows: it may skip for what Windows is, up to a number).
# The run's conclusion is the gate: nothing reads a job by its name.

jobs:
  host:
    name: Host ACL, Podman machine, native pieces
    runs-on: windows-2022
    # The host checks and both groups under pwsh take about 15 minutes; a hung step must not hold the gate for hours.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Host ACL and fail-closed wrapper selftest
        shell: pwsh
        run: ./scripts/windows-config-acl-selftest.ps1

      - name: Podman machine deadline and counter-proof on PowerShell 5.1 and 7
        shell: pwsh
        run: ./scripts/ci/podman_machine_bridge_gate.ps1

      # The Podman-in-WSL pieces only a real Windows runs: the docker.exe shims
      # compiled with Add-Type (the enabler's, which the product installs, and
      # the probe's) and ConvertTo-WslPath on real Windows paths, under
      # Windows PowerShell 5.1 and pwsh. The pytest jobs of test.yml all run on
      # ubuntu, where these tests skip: until this step nothing ran them.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pytest and PyYAML
        run: |
          pip install --require-hashes -r tests/requirements-ci.txt
          pip install --require-hashes -r tests/requirements-windows-gate.txt
      # A skip here is a failure: with a shell missing the step would be green
      # having proved nothing. 203 = 41 cases of the native file (its shim only
      # under Windows PowerShell 5.1) + the probe's shim under powershell and pwsh
      # + 14 cases of the JSON the scripts read from Podman, under both shells:
      # the app runs them with Windows PowerShell 5.1, whose ConvertFrom-Json
      # does not enumerate an array + 8 cases of the arguments handed to Podman
      # and Docker, under both shells: 5.1 drops the double quotes inside a
      # native argument + 10 cases of a native program writing on stderr under
      # 'Stop', which 5.1 turns into an error that stops the script + 18 cases of
      # the same in the wrapper (jht.ps1), under both shells + 19 cases of the ACL walk (static
      # checks, a junction in the folder, one turned into a junction while the
      # walk runs, under both shells) + 18 cases of the wrapper on a profile with no host.env,
      # no private folder and no integrity manifest yet (the reading block under both shells,
      # the ACL and node checks answering False for what is not there). The count may grow, never shrink.
      - name: Native Windows pieces of the Podman runtime
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
        run: |
          $files = @(python tests/windows_gate_files.py --host)
          $out = python -m pytest @files -n 4 -p no:cacheprovider -rs 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { "$_" }
          if ($code -ne 0) { exit $code }
          $summary = "$($out[-1])"
          if ($summary -notmatch '^=+ (\d+) passed(, \d+ warnings?)? in [0-9.]+s') { throw "unexpected pytest summary: $summary" }
          if ([int]$Matches[1] -lt 203) { throw "only $($Matches[1]) native Windows tests ran, expected at least 203" }

      # Measures for T80: under 5.1 the step below takes 12.5 minutes here and
      # 2 on a real Windows PC, under pwsh 44 s. What one start of each shell
      # costs on this runner, cold and warm (each test of the step starts one).
      - name: Shell start-up cost (powershell.exe 5.1 and pwsh)
        shell: pwsh
        run: |
          foreach ($exe in 'powershell', 'pwsh') {
            $times = foreach ($i in 1..5) {
              $clock = [Diagnostics.Stopwatch]::StartNew()
              & $exe -NoLogo -NoProfile -NonInteractive -Command 'exit 0'
              $clock.Stop()
              [Math]::Round($clock.Elapsed.TotalMilliseconds)
            }
            $line = "$exe start-up ms: $($times -join ', ')"
            $line
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      # The floor of the shell jobs below: they run a slice of each group, so the whole of it is counted here, once.
      # A test that disappears from a file (or a file out of the list) fails here. STRICT 428 and OPEN 556 are the tests
      # of the two groups as they run today. The count may grow, never shrink.
      - name: Count of the tests the shell jobs run
        shell: pwsh
        run: |
          $groups = @(
            @{ Name = 'strict'; Min = 428 },
            @{ Name = 'open'; Min = 556 }
          )
          foreach ($group in $groups) {
            $files = @(python tests/windows_gate_files.py "--$($group.Name)")
            if ($files.Count -eq 0) { throw "the list of the group $($group.Name) is empty" }
            $out = python -m pytest @files --collect-only -q -p no:cacheprovider 2>&1
            $out | Select-Object -Last 3 | ForEach-Object { "$_" }
            $line = @($out | ForEach-Object { "$_" } | Where-Object { $_ -match '^\d+ tests? collected' }) | Select-Object -Last 1
            if (-not $line -or $line -notmatch '^(\d+) tests? collected') { throw "no collected count for $($group.Name)" }
            if ([int]$Matches[1] -lt $group.Min) { throw "$($group.Name): only $($Matches[1]) tests collected, expected at least $($group.Min)" }
            "$($group.Name): $($Matches[1]) tests ($($files.Count) files, at least $($group.Min))"
          }

      # Some of the open group's tests start the CLI of the repository (the upload of a document from Windows
      # paths): its packages, and those of shared/ and shared/cron that it imports, are not on a fresh runner.
      - name: Install the packages of the CLI
        run: |
          foreach ($folder in 'cli', 'shared', 'shared/cron') {
            npm ci --prefix $folder --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Both groups of tests under pwsh, in the same job as the host checks (the 5.1 slices are the other six jobs).
      - name: PowerShell 7 (pwsh), strict group
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
          JHT_TEST_SHELL: pwsh
          JHT_TEST_SLICE: "0/1"
        run: |
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_gate_group.ps1"
          exit (Invoke-GateGroup -Group strict -MaxSkipped 0)

      # `skipped` 114 = the 89 skips of what Windows is at the measure of 11/11 and a margin of 25.
      - name: PowerShell 7 (pwsh), open group
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
          JHT_TEST_SHELL: pwsh
          JHT_TEST_SLICE: "0/1"
        run: |
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_gate_group.ps1"
          exit (Invoke-GateGroup -Group open -MaxSkipped 114)

  shells:
    name: ${{ matrix.title }}
    runs-on: windows-2022
    # A slice takes about 12 minutes; a hung step must not hold the gate for hours.
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      # A red slice does not cancel the others: the run says every test that fails, not only the first slice's.
      fail-fast: false
      matrix:
        include:
          # Slice k of 6 of the strict group and of the open group, under Windows PowerShell 5.1. What a slice must run is
          # read from its own collection (windows_gate_group.ps1): every test passed or skipped, none lost; the strict group
          # may skip none, the open one up to 35 a slice (what Windows is: no bash, no Linux container; 89 in all, about 15
          # a slice, at the measure of 11/11). The total of each group is counted by the host job (it may grow, never shrink).
          - { title: "Windows PowerShell 5.1, slice 1 of 6", slice: "0/6" }
          - { title: "Windows PowerShell 5.1, slice 2 of 6", slice: "1/6" }
          - { title: "Windows PowerShell 5.1, slice 3 of 6", slice: "2/6" }
          - { title: "Windows PowerShell 5.1, slice 4 of 6", slice: "3/6" }
          - { title: "Windows PowerShell 5.1, slice 5 of 6", slice: "4/6" }
          - { title: "Windows PowerShell 5.1, slice 6 of 6", slice: "5/6" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pytest and PyYAML
        run: |
          pip install --require-hashes -r tests/requirements-ci.txt
          pip install --require-hashes -r tests/requirements-windows-gate.txt
      # Some of the open group's tests start the CLI of the repository (the upload of a document from Windows
      # paths): its packages, and those of shared/ and shared/cron that it imports, are not on a fresh runner.
      - name: Install the packages of the CLI
        run: |
          foreach ($folder in 'cli', 'shared', 'shared/cron') {
            npm ci --prefix $folder --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # A missing shell, bash or compiler fails (JHT_REQUIRE_WINDOWS_SHELLS), and so does a real Podman visible to
      # Find-Podman here (CI is set).
      - name: Strict group under Windows PowerShell 5.1
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
          JHT_TEST_SHELL: powershell
          JHT_TEST_SLICE: ${{ matrix.slice }}
        run: |
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_gate_group.ps1"
          exit (Invoke-GateGroup -Group strict -MaxSkipped 0)
      - name: Open group under Windows PowerShell 5.1
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
          JHT_TEST_SHELL: powershell
          JHT_TEST_SLICE: ${{ matrix.slice }}
        run: |
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_gate_group.ps1"
          exit (Invoke-GateGroup -Group open -MaxSkipped 35)

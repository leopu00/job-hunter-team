name: Windows config ACL gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/install.ps1'
      - 'scripts/jht-wrapper.ps1'
      - 'scripts/windows-config-acl-selftest.ps1'
      - 'scripts/windows-private-acl.ps1'
      - 'scripts/enable-podman-windows-runtime.ps1'
      - 'scripts/configure-podman-windows-network.ps1'
      - 'scripts/podman-windows-probe.ps1'
      - 'web/public/install.ps1'
      - 'tests/test_windows_native_runtime_pieces.py'
      - 'tests/test_podman_windows_probe.py'
      - 'tests/test_windows_powershell51_json.py'
      - 'tests/test_windows_podman_wsl_branches.py'
      - 'tests/test_podman_windows_setup_retry.py'
      - 'tests/test_podman_windows_sidecar_idmap.py'
      - 'tests/test_podman_windows_cgroupfs.py'
      - 'tests/test_windows_startup_task_sid.py'
      - 'tests/windows_native_fakes.py'
      - 'tests/test_windows_powershell51_native_quotes.py'
      - 'tests/test_windows_powershell51_native_stderr.py'
      - 'tests/test_windows_powershell51_wrapper_native_stderr.py'
      - 'scripts/jht-uninstall-windows.ps1'
      - 'desktop/src-tauri/windows/installer-hooks.nsi'
      - 'tests/test_windows_app_uninstall.py'
      - 'tests/conftest.py'
      - 'tests/requirements-ci.txt'
      - '.github/workflows/windows-config-acl.yml'

permissions:
  contents: read

jobs:
  acl:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Host ACL and fail-closed wrapper selftest
        shell: pwsh
        run: ./scripts/windows-config-acl-selftest.ps1

      # The Podman-in-WSL pieces only a real Windows runs: the docker.exe shims
      # compiled with Add-Type (the enabler's, which the product installs, and
      # the probe's) and ConvertTo-WslPath on real Windows paths, under
      # Windows PowerShell 5.1 and pwsh. The pytest jobs of test.yml all run on
      # ubuntu, where these tests skip: until this step nothing ran them.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install --require-hashes -r tests/requirements-ci.txt
      # A skip here is a failure: with a shell missing the step would be green
      # having proved nothing. 93 = 41 cases of the native file (its shim only
      # under Windows PowerShell 5.1) + the probe's shim under powershell and pwsh
      # + 14 cases of the JSON the scripts read from Podman, under both shells:
      # the app runs them with Windows PowerShell 5.1, whose ConvertFrom-Json
      # does not enumerate an array + 8 cases of the arguments handed to Podman
      # and Docker, under both shells: 5.1 drops the double quotes inside a
      # native argument + 10 cases of a native program writing on stderr under
      # 'Stop', which 5.1 turns into an error that stops the script + 18 cases of
      # the same in the wrapper (jht.ps1), under both shells. The count may
      # grow, never shrink.
      - name: Native Windows pieces of the Podman runtime
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
        run: |
          $out = python -m pytest tests/test_windows_native_runtime_pieces.py `
            'tests/test_podman_windows_probe.py::test_native_shim_compiles_and_propagates_backend_exit_code' `
            tests/test_windows_powershell51_json.py `
            tests/test_windows_powershell51_native_quotes.py `
            tests/test_windows_powershell51_native_stderr.py `
            tests/test_windows_powershell51_wrapper_native_stderr.py `
            -n 4 -p no:cacheprovider -rs 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { "$_" }
          if ($code -ne 0) { exit $code }
          $summary = "$($out[-1])"
          if ($summary -notmatch '^=+ (\d+) passed(, \d+ warnings?)? in [0-9.]+s') { throw "unexpected pytest summary: $summary" }
          if ([int]$Matches[1] -lt 93) { throw "only $($Matches[1]) native Windows tests ran, expected at least 93" }

      # Measures for T80: under 5.1 the step below takes 12.5 minutes here and
      # 2 on a real Windows PC, under pwsh 44 s. What one start of each shell
      # costs on this runner, cold and warm (each test of the step starts one).
      - name: Shell start-up cost (powershell.exe 5.1 and pwsh)
        shell: pwsh
        run: |
          foreach ($exe in 'powershell', 'pwsh') {
            $times = foreach ($i in 1..5) {
              $clock = [Diagnostics.Stopwatch]::StartNew()
              & $exe -NoLogo -NoProfile -NonInteractive -Command 'exit 0'
              $clock.Stop()
              [Math]::Round($clock.Elapsed.TotalMilliseconds)
            }
            $line = "$exe start-up ms: $($times -join ', ')"
            $line
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      # The sh-faked tests of the Podman-in-WSL setup, once under each shell:
      # the app runs Windows PowerShell 5.1, the ubuntu pytest job PowerShell 7.
      # The fakes run under Git for Windows' bash behind a native launcher
      # (tests/windows_native_fakes.py); every case checks the engine it ran
      # under. A missing shell, bash or compiler fails, and so does a real
      # Podman visible to Find-Podman here (CI is set). A skip fails the count.
      # 112 = the five whole files (48 + 41 + 11 + 7 + 5): the setup's repair of a broker
      # or Telegram service (T85, T87), the cgroup manager of the Podman service (T87),
      # and the logon task's user compared as a SID on this Windows (T100).
      - name: Podman-in-WSL setup tests under Windows PowerShell 5.1 and pwsh
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
        run: |
          foreach ($shell in 'powershell', 'pwsh') {
            $env:JHT_TEST_SHELL = $shell
            $out = python -m pytest tests/test_windows_podman_wsl_branches.py tests/test_podman_windows_setup_retry.py tests/test_podman_windows_sidecar_idmap.py tests/test_podman_windows_cgroupfs.py tests/test_windows_startup_task_sid.py `
              -n 4 -p no:cacheprovider -rs --durations=15 --durations-min=1 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { "$_" }
            if ($code -ne 0) { exit $code }
            $summary = "$($out[-1])"
            if ($summary -notmatch '^=+ (\d+) passed(, \d+ warnings?)? in [0-9.]+s') { throw "unexpected pytest summary under ${shell}: $summary" }
            if ([int]$Matches[1] -lt 112) { throw "only $($Matches[1]) tests ran under $shell, expected at least 112" }
          }

      # The desktop app's Windows uninstaller and the team (T72): its NSIS hook
      # run by an interpreter, and jht-uninstall-windows.ps1 on two fake
      # profiles with a fake podman.exe (the sh fakes above), fake scheduled
      # tasks and a fake HKCU\Environment, plus the real HKCU\Environment on a
      # scratch value. Once under each shell: the uninstaller runs the script
      # with Windows PowerShell 5.1. A skip fails the count. 165 = the whole file.
      - name: The app's uninstaller script under Windows PowerShell 5.1 and pwsh
        shell: pwsh
        env:
          JHT_REQUIRE_WINDOWS_SHELLS: "1"
        run: |
          foreach ($shell in 'powershell', 'pwsh') {
            $env:JHT_TEST_SHELL = $shell
            $out = python -m pytest tests/test_windows_app_uninstall.py -n 4 -p no:cacheprovider -rs 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { "$_" }
            if ($code -ne 0) { exit $code }
            $summary = "$($out[-1])"
            if ($summary -notmatch '^=+ (\d+) passed(, \d+ warnings?)? in [0-9.]+s') { throw "unexpected pytest summary under ${shell}: $summary" }
            if ([int]$Matches[1] -lt 165) { throw "only $($Matches[1]) tests ran under $shell, expected at least 165" }
          }

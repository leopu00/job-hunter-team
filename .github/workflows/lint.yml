name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  eslint-web:
    name: ESLint — web/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  eslint-desktop-payload:
    name: ESLint + type-check — desktop payload
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/app-payload/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: desktop/app-payload/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Lint regression contracts
        run: npm run test:lint-contracts

      - name: Type-check
        run: npx tsc --noEmit

  prettier:
    name: Prettier check — web/ + shared/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Prettier
        # Versione FISSA: senza pin `npm install prettier` prende l'ultima e una
        # nuova release riformatta file non toccati → Lint rosso su PR estranee.
        # Allineata alla 3.8.3 contro cui il repo è già formattato.
        run: npm install --no-save prettier@3.8.3

      - name: Prettier check — web/
        run: npx prettier --check "web/app/**/*.{ts,tsx}"

      - name: Prettier check — shared/
        run: npx prettier --check "shared/**/*.ts" --ignore-path /dev/null

  # `scripts/review-log.py sync` non era agganciato a niente: il registro è
  # stato riallineato a mano il 2026-07-30 (49 date, 22 file) e da lì in poi
  # nulla impediva che si sfasasse di nuovo. Qui gira la variante read-only.
  #
  # Perché CI e non un hook pre-commit:
  #  - un hook che rigenera `docs/REVIEW-LOG.md` e lo mette in stage cambia il
  #    contenuto del commit dell'utente. È invasivo e sorprende;
  #  - e non funzionerebbe comunque. La colonna `🔄 Update` viene da
  #    `git log -1 --format=%cs`: al momento del pre-commit il commit non
  #    esiste ancora, quindi ogni .md in stage porterebbe la data
  #    *precedente*. Il file nascerebbe già sfasato.
  #
  # `check` non scrive niente e non tocca mai `last_review` — la colonna
  # «letto» resta vuota finché qualcuno legge davvero. Confronta solo
  # l'insieme dei file e le colonne che vengono dal JSON; le due colonne
  # derivate da git sono escluse, altrimenti il gate sarebbe rosso su ogni PR
  # che tocca un .md, per un motivo che nessuno può correggere.
  #
  # Gira su ogni PR e non solo su quelle che toccano un .md: filtrare per path
  # a livello di workflow gaterebbe anche ESLint e Prettier, e un check
  # skippato che la branch protection aspetta blocca la PR. Il job costa
  # ~15 secondi e non installa dipendenze.
  review-log:
    name: Review log — indice allineato
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        # Basta il checkout shallow: `check` non legge la history (le uniche
        # colonne che la userebbero sono proprio quelle che non confronta).

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: review-log check
        run: python scripts/review-log.py check

  # `.pre-commit-config.yaml` configura quattro hook che nessuna pipeline
  # eseguiva: `grep` su .github/workflows/ dava zero risultati e l'unico
  # installer dell'hook è scripts/setup.sh, marcato deprecated dal suo stesso
  # README. Quattro gate configurati e mai eseguiti sono quattro gate che non
  # esistono.
  #
  # Qui girano i due che proteggono ciò che cambia più spesso: i workflow.
  # `pre-commit run` accetta un solo hook-id per invocazione, quindi due step.
  # Le versioni restano quelle pinnate in .pre-commit-config.yaml — una sola
  # fonte di verità, il workflow non le duplica.
  #
  # Restano fuori, di proposito:
  #  - `detect-secrets`: `.secrets.baseline` è del 2026-04-27 e oggi il hook
  #    esce 1 con 55 finding su 20 file (i18n del gioco, i selftest del
  #    redactor, le pagine /secrets e /providers del web — false-positive da
  #    auditare, non secret). Accenderlo senza rigenerare la baseline
  #    significa un gate rosso al primo run, che è il modo più rapido per
  #    farlo disattivare. Rigenerare la baseline è un audit a sé.
  #  - `npm-audit-prod`: `security.yml` ha già un job `npm audit` sulle
  #    dipendenze di produzione, non serve un secondo posto in cui gira.
  workflow-gates:
    name: pre-commit — actionlint + zizmor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # L'hook actionlint è `language: golang`: pre-commit si scarica la
      # toolchain e la compila al primo run. Senza cache sono ~2 minuti per
      # ogni PR, spesi sempre sulla stessa versione pinnata.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      # Sintassi dei workflow + best practice (uses inesistenti, expression
      # rotte, shell malformate).
      - name: actionlint
        run: pre-commit run --all-files --show-diff-on-failure actionlint

      # Audit di sicurezza dei workflow: poison pipeline, input non fidati,
      # template injection, immagini non pinnate.
      - name: zizmor
        run: pre-commit run --all-files --show-diff-on-failure zizmor

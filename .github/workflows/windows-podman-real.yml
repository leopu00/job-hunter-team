name: Windows real Podman install (not blocking)
# The user's path on Windows, end to end, with the real Podman and the real
# WSL2 of the windows-2025 runner (the WSL2 probe, run 39873784113, booted a
# distribution there): install.ps1 under Windows PowerShell 5.1, the shell the
# desktop app runs it with, then `jht up`, then install.ps1 again over the
# running container (an app update). The Windows defects of pushes 4 to 8
# (T60, T71) passed every gate with shell-faked Podman and were found only by
# the hand test after the build: this job runs what those gates fake.
# Not a required check: its result and times are for reading, not for
# stopping a merge, until it has shown it is stable.
on:
  workflow_dispatch:
  push:
    branches:
      - master-arthur
    paths:
      - 'web/public/install.ps1'
      - 'scripts/jht-wrapper.ps1'
      - 'scripts/windows-private-acl.ps1'
      - 'scripts/enable-podman-windows-runtime.ps1'
      - 'scripts/configure-podman-windows-network.ps1'
      - 'scripts/podman-machine-bridge.ps1'
      - 'scripts/podman-windows-probe.ps1'
      - 'scripts/wsl-interop-connect-proxy.py'
      - 'docker-compose.yml'
      - 'docker-compose.podman.yml'
      - 'scripts/ci/windows_podman_real_run.ps1'
      - '.github/workflows/windows-podman-real.yml'

permissions:
  contents: read

concurrency:
  group: windows-podman-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-podman:
    name: install, start, update, counter-check (windows-2025, PowerShell 5.1)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        # Windows PowerShell 5.1: the shell the app runs install.ps1 and jht.ps1 with.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Attest exact source before real installation
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:RUNNER_TEMP 't205-real-proof'
          New-Item -ItemType Directory -Path $proof -Force | Out-Null
          "T205_PROOF=$proof" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $head = git rev-parse HEAD
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Real Podman source is not the approved immutable source.' }
          "T205_SOURCE_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "controller=$env:GITHUB_SHA source=$head tree=$tree" | Tee-Object -FilePath (Join-Path $proof 'source-before.txt')
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Real Podman source is dirty before installation.' }
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw 'No immutable input manifest.' }
          $lines = @($files | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_ })
          [IO.File]::WriteAllLines((Join-Path $proof 'inputs-before.sha256'), $lines, [Text.UTF8Encoding]::new($false))

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # install.ps1 downloads the runtime files from JHT_RAW_BASE when it is set:
      # here a server on loopback with this commit's files, so the job installs
      # what was pushed, not the published release. A copy, so the counter-check
      # below can change one file without touching the checkout.
      - name: Serve this commit's runtime files on loopback
        run: |
          $ErrorActionPreference = 'Stop'
          "PowerShell $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'this job must run under Windows PowerShell 5.1' }
          $env:SERVED = Join-Path $env:RUNNER_TEMP 'served'
          $env:TIMES = Join-Path $env:RUNNER_TEMP 'times.tsv'
          "SERVED=$env:SERVED" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "TIMES=$env:TIMES" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          New-Item -ItemType Directory -Path "$env:SERVED\scripts" -Force | Out-Null
          foreach ($relative in 'docker-compose.yml', 'docker-compose.podman.yml') {
            Copy-Item -LiteralPath $relative -Destination (Join-Path $env:SERVED $relative)
          }
          # The whole scripts folder, not a list of names: install.ps1 downloads each runtime script it ships from the
          # base above, and a name added to its list (jht-integration.ps1 on 10/11, jht-tools.ps1 after it) that this step
          # did not copy made every run since fail in 2 s with «(404) Not Found» before the install began.
          Copy-Item -Path 'scripts\*' -Destination (Join-Path $env:SERVED 'scripts') -Recurse
          $server = Start-Process -FilePath python -ArgumentList @('-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $env:SERVED) -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/docker-compose.yml' | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/docker-compose.yml' | Out-Null
          "server pid $($server.Id)"
          "JHT_RAW_BASE=http://127.0.0.1:8765" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "step`tseconds`texit" | Out-File -FilePath $env:TIMES -Encoding ascii
          & wsl.exe --version 2>&1 | ForEach-Object { "  $_" }
          & winget --version 2>&1 | ForEach-Object { "  winget $_" }

      # The runtime image of this job is the build of the pile, not the release pin. install.ps1 starts the image it
      # is given with the compose of this commit, and the compose of this commit starts the portal-secrets broker
      # (jht-broker) and the Telegram service (jht-telegram-service) in it. The pin of release/runtime-image.v1.json
      # is the image of 14/08, from before both existed: with it `docker compose up` started two containers whose
      # command was not in the image and they left with exit 127, «runtime_containers_unhealthy», after 300 s, in
      # every run since the broker came (T146). `master-arthur` is the tag the TEST builds of the pile are
      # pushed under (docker.yml, dispatched on that branch); it is read here as a digest, so that install.ps1
      # (which wants `repository@sha256:...` and checks what it pulled) is given exactly one image for the whole job.
      - name: Take the runtime image of the pile (the tag master-arthur, as a digest)
        run: |
          $ErrorActionPreference = 'Stop'
          $token = (Invoke-RestMethod -UseBasicParsing -Uri 'https://ghcr.io/token?service=ghcr.io&scope=repository:leopu00/jht:pull').token
          $accept = 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          $answer = Invoke-WebRequest -UseBasicParsing -Uri 'https://ghcr.io/v2/leopu00/jht/manifests/master-arthur' -Headers @{ Authorization = "Bearer $token"; Accept = $accept }
          $digest = [string]$answer.Headers['Docker-Content-Digest']
          if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "the tag master-arthur has no digest: '$digest'" }
          "JHT_IMAGE=ghcr.io/leopu00/jht@$digest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "JHT_IMAGE_DIGEST=$digest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "runtime image of this job: ghcr.io/leopu00/jht@$digest (tag master-arthur)"
          # The image of the tools on request (the live screen), of the same build: install.ps1 pins it on the test
          # channel and `jht screen on` pulls it (about 3 minutes here).
          $extras = Invoke-WebRequest -UseBasicParsing -Uri 'https://ghcr.io/v2/leopu00/jht/manifests/master-arthur-extras' -Headers @{ Authorization = "Bearer $token"; Accept = $accept }
          $extrasDigest = [string]$extras.Headers['Docker-Content-Digest']
          if ($extrasDigest -notmatch '^sha256:[0-9a-f]{64}$') { throw "the tag master-arthur-extras has no digest: '$extrasDigest'" }
          "JHT_EXTRAS_DIGEST=$extrasDigest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "extras image of this job: ghcr.io/leopu00/jht@$extrasDigest (tag master-arthur-extras)"

      # Every run of a script goes through the same runner: powershell.exe 5.1
      # with the app's arguments, its output timestamped (JHT_PHASE lines show
      # where the time goes), its exit code and duration kept for the summary.
      # A new Windows user has no Documents\Job Hunter Team: the compose mounts it,
      # and Podman, unlike Docker, does not create a missing bind-mount source (T83).
      # The job checks it runs that case, and that the install leaves the folder.
      - name: Install (first, fresh machine, a user with no Documents\Job Hunter Team)
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_podman_real_run.ps1"
          $documents = Join-Path $env:USERPROFILE 'Documents\Job Hunter Team'
          if (Test-Path -LiteralPath $documents) { throw "the runner already has ${documents}: this job would not see T83" }
          $code = Invoke-Timed 'install (first)' 'web\public\install.ps1' @('-SkipOnboard', '-SourceSha', $env:GITHUB_SHA, '-Image', $env:JHT_IMAGE, '-ExpectedImageDigest', $env:JHT_IMAGE_DIGEST, '-ExtrasImageDigest', $env:JHT_EXTRAS_DIGEST)
          if ($code -eq 0 -and -not (Test-Path -LiteralPath $documents -PathType Container)) {
            Write-Host "install.ps1 passed but left no $documents"
            $code = 1
          }
          exit $code

      # T103: the wrapper refuses its runtime with one message for four causes («untrusted host runtime
      # path, owner, reparse point or SHA-256»). When the install fails, what that check reads: who runs
      # (the runner's user is an elevated administrator, the app's is not), and for the runtime folder
      # and every file of the bundle its owner, whether that owner is the current user, and reparse points.
      - name: Diagnose a refused runtime bundle (T103)
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          $me = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]$me).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "user $($me.Name) $($me.User.Value), elevated administrator: $elevated"
          $runtime = Join-Path $env:LOCALAPPDATA 'Job Hunter Team\host-runtime'
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          $nodes = @(Get-Item -LiteralPath $runtime, $bin -Force -ErrorAction SilentlyContinue)
          $nodes += @(Get-ChildItem -LiteralPath $runtime -Force -File -ErrorAction SilentlyContinue)
          $nodes += @(Get-ChildItem -LiteralPath (Join-Path $runtime 'bin') -Force -File -ErrorAction SilentlyContinue)
          $nodes += @(Get-ChildItem -LiteralPath $bin -Force -File -ErrorAction SilentlyContinue)
          foreach ($node in $nodes) {
            $owner = (Get-Acl -LiteralPath $node.FullName).Owner
            $ownerSid = try { ([Security.Principal.NTAccount]$owner).Translate([Security.Principal.SecurityIdentifier]).Value } catch { '?' }
            $reparse = ($node.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
            "{0,-5} owner={1} ({2}) reparse={3}  {4}" -f $(if ($ownerSid -eq $me.User.Value) { 'OK' } else { 'OTHER' }), $owner, $ownerSid, $reparse, $node.FullName
          }
          if (-not (Test-Path -LiteralPath $runtime)) { "no runtime folder: $runtime"; exit 0 }
          "runtime folder access:"
          foreach ($rule in @((Get-Acl -LiteralPath $runtime).Access)) {
            "  $($rule.IdentityReference) $($rule.AccessControlType) $($rule.FileSystemRights) inherited=$($rule.IsInherited)"
          }
          $manifest = Join-Path $runtime '.runtime-integrity'
          if (Test-Path -LiteralPath $manifest) {
            "manifest against the files:"
            foreach ($line in Get-Content -LiteralPath $manifest) {
              $key, $value = $line -split '=', 2
              # the wrapper is installed as jht.ps1, next to its ACL helper
              $name = if ($key -eq 'jht-wrapper.ps1') { 'jht.ps1' } else { $key }
              $file = @((Join-Path $runtime $name), (Join-Path $bin $name), (Join-Path $runtime "bin\$name")) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
              $actual = if ($file) { (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant() } else { '(no file)' }
              "  {0,-5} {1}" -f $(if ($key -eq 'version' -or $actual -eq $value) { 'OK' } else { 'DIFF' }), $key
            }
          }

      - name: Start the container (jht up) and read its status
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_podman_real_run.ps1"
          $wrapper = Join-Path $env:USERPROFILE '.local\bin\jht.ps1'
          $code = Invoke-Timed 'jht up' $wrapper @('up')
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht status' $wrapper @('status')
          exit $code

      - name: Install again over the running container (an app update)
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_podman_real_run.ps1"
          $code = Invoke-Timed 'install (update)' 'web\public\install.ps1' @('-SkipOnboard', '-SourceSha', $env:GITHUB_SHA, '-Image', $env:JHT_IMAGE, '-ExpectedImageDigest', $env:JHT_IMAGE_DIGEST, '-ExtrasImageDigest', $env:JHT_EXTRAS_DIGEST)
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht status (after update)' (Join-Path $env:USERPROFILE '.local\bin\jht.ps1') @('status')
          exit $code

      # The path of the person after the install, as far as it costs little here (the round on a clean profile of a
      # real PC stays the test of the installer as a user sees it; this says at every push whether it broke).
      # The setup is given a made-up key in a file written the way `echo key > file` writes it under Windows PowerShell 5.1
      # (UTF-16): the wrapper reads the file, hands the key to the setup on its standard input, and the setup keeps it.
      - name: Setup with a made-up key from a file, then the team
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_podman_real_run.ps1"
          $wrapper = Join-Path $env:USERPROFILE '.local\bin\jht.ps1'
          # Not a real key and not the shape of one: 'fake' and zeros, built here so that the file never sits in the repository.
          $keyFile = Join-Path $env:RUNNER_TEMP 'made-up-key.txt'
          ('fake' + ('0' * 40)) | Out-File -FilePath $keyFile
          $code = Invoke-Timed 'jht setup (key from a file)' $wrapper @('setup', '--non-interactive', '--provider', 'glm', '--harness', 'pi', '--api-key-file', $keyFile, '--skip-health')
          Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht team start' $wrapper @('team', 'start', '--skip-key-check')
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht status (team started)' $wrapper @('status')
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht team stop' $wrapper @('team', 'stop')
          exit $code

      - name: The live screen on and off
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_podman_real_run.ps1"
          $wrapper = Join-Path $env:USERPROFILE '.local\bin\jht.ps1'
          $code = Invoke-Timed 'jht screen on' $wrapper @('screen', 'on')
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht screen status (on)' $wrapper @('screen', 'status')
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht screen off' $wrapper @('screen', 'off')
          if ($code -ne 0) { exit $code }
          $code = Invoke-Timed 'jht screen status (off)' $wrapper @('screen', 'status')
          exit $code

      # The counter-check this job carries with it: the enabler served again with
      # the template of before T71 (a double quote inside a native argument, which
      # Windows PowerShell 5.1 drops). install.ps1 must fail on it the way the hand
      # test saw it; if it passes, this job cannot see that class of defect.
      - name: Counter-check - the T71 template makes the install fail under 5.1
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_podman_real_run.ps1"
          $enabler = Join-Path $env:SERVED 'scripts\enable-podman-windows-runtime.ps1'
          $text = [IO.File]::ReadAllText($enabler)
          # The block T71 wrote, its comment included, gives way to the two lines of before.
          $fixed = $text.IndexOf('[string]$existingLabelsJson = ')
          $start = $text.LastIndexOf('# No double quote inside a native argument', [Math]::Max($fixed, 0))
          $end = $text.IndexOf('[string]$existingCgroupManager = ')
          if ($fixed -lt 0 -or $start -lt 0 -or $fixed - $start -gt 600 -or $end -lt $fixed) { throw 'counter-check: the fixed block is not where expected; update this step' }
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
          $old = '[string]$existingProject = (& $Podman --connection $MachineName inspect jht --format ''{{index .Config.Labels "com.docker.compose.project"}}'' 2>$null | Select-Object -First 1)' + $nl + '$existingProject = $existingProject.Trim()' + $nl
          [IO.File]::WriteAllText($enabler, $text.Substring(0, $start) + $old + $text.Substring($end), (New-Object Text.UTF8Encoding $false))
          $code = Invoke-Timed 'counter-check T71' 'web\public\install.ps1' @('-SkipOnboard')
          $seen = Select-String -LiteralPath $script:LastLog -SimpleMatch 'function "com" not defined' -Quiet
          [IO.File]::WriteAllText($enabler, $text, (New-Object Text.UTF8Encoding $false))
          if ($code -eq 0) { throw 'counter-check: install.ps1 passed with the T71 template, so this job does not see that defect' }
          if (-not $seen) { throw "counter-check: install.ps1 failed ($code) but not with the T71 error (function ""com"" not defined)" }
          "counter-check: red as expected (exit $code, Podman refused the template without its quotes)"
          # The runner ends a powershell step with `exit $LASTEXITCODE`: still the install's 1 here.
          exit 0

      # The way out: `jht uninstall` with --purge on the machine the steps above made, then everything it made is
      # looked for: the Podman machine, the runtime folder, the commands in bin, the folders of the person's data and
      # the startup task. A thing left behind fails the step with its name.
      - name: Uninstall (--purge) and check that nothing is left
        run: |
          $ErrorActionPreference = 'Continue'
          . "$env:GITHUB_WORKSPACE\scripts\ci\windows_podman_real_run.ps1"
          $wrapper = Join-Path $env:USERPROFILE '.local\bin\jht.ps1'
          $code = Invoke-Timed 'jht uninstall --purge' $wrapper @('uninstall', '--confirm', '--purge')
          if ($code -ne 0) { exit $code }
          $env:PATH = @($env:PATH, [Environment]::GetEnvironmentVariable('Path', 'Machine'), [Environment]::GetEnvironmentVariable('Path', 'User')) -join ';'
          $left = @(Get-JhtLeftovers)
          if ($left.Count -gt 0) { $left | ForEach-Object { "LEFT: $_" }; throw "uninstall --purge left $($left.Count) thing(s)" }
          "nothing of Job Hunter Team is left on this runner"

      - name: Times
        if: always()
        # Only here: the app does not set it, so the install steps run without it.
        env:
          WSL_UTF8: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          # Podman's directory went in the machine or user PATH during the install,
          # not in this step's environment.
          $env:PATH = @($env:PATH, [Environment]::GetEnvironmentVariable('Path', 'Machine'), [Environment]::GetEnvironmentVariable('Path', 'User')) -join ';'
          if (Test-Path -LiteralPath $env:TIMES) {
            $rows = @(Import-Csv -LiteralPath $env:TIMES -Delimiter "`t")
            $lines = @('| step | seconds | exit |', '|---|---:|---:|') + @($rows | ForEach-Object { "| $($_.step) | $($_.seconds) | $($_.exit) |" })
            $lines | ForEach-Object { $_ }
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          & podman machine list 2>&1 | ForEach-Object { "  $_" }
          & wsl.exe --list --verbose 2>&1 | ForEach-Object { "  $_" }
          # `wsl --list` exits 1 when no distribution is left, which is what the uninstall must leave: not a failure of this step.
          exit 0

      - name: Preserve logs and attest unchanged source
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:RUNNER_TEMP 't205-real-proof'
          New-Item -ItemType Directory -Path $proof -Force | Out-Null
          foreach ($log in @('install-first-.log', 'install-update-.log', 'jht-up.log', 'jht-status.log', 'jht-status-after-update-.log', 'jht-setup-key-from-a-file-.log', 'jht-team-start.log', 'jht-status-team-started-.log', 'jht-team-stop.log', 'jht-screen-on.log', 'jht-screen-status-on-.log', 'jht-screen-off.log', 'jht-screen-status-off-.log', 'counter-check-T71.log', 'jht-uninstall-purge.log', 'times.tsv')) {
            $path = Join-Path $env:RUNNER_TEMP $log
            if (Test-Path -LiteralPath $path -PathType Leaf) { Copy-Item -LiteralPath $path -Destination (Join-Path $proof $log) }
          }
          $head = git rev-parse HEAD
          $tree = git rev-parse 'HEAD^{tree}'
          "controller=$env:GITHUB_SHA source=$head tree=$tree" | Out-File -FilePath (Join-Path $proof 'source-after.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA -or $tree -ne $env:T205_SOURCE_TREE) { throw 'Real Podman source changed.' }
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw 'Missing post-install input manifest.' }
          $lines = @($files | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_ })
          [IO.File]::WriteAllLines((Join-Path $proof 'inputs-after.sha256'), $lines, [Text.UTF8Encoding]::new($false))
          $before = [IO.File]::ReadAllText((Join-Path $proof 'inputs-before.sha256'))
          $after = [IO.File]::ReadAllText((Join-Path $proof 'inputs-after.sha256'))
          if ($before -cne $after) { throw 'Real Podman installation changed canonical inputs.' }
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Real Podman source diff is not clean.' }

      - name: Upload complete real Podman proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-podman-install-proof
          path: ${{ runner.temp }}/t205-real-proof/
          include-hidden-files: true
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

# Il ref Git e' il claim immutabile della versione. Due rerun dello stesso tag
# non possono attraversare insieme il check-then-publish del registry; il
# secondo entra solo dopo che il primo ha pubblicato e verifica lo stesso
# digest. Un tag divergente resta un errore e non viene sovrascritto.
concurrency:
  group: release-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag ↔ package.json versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require the current production commit
        run: |
          git fetch origin production --depth=1
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse origin/production)"
      - name: Verify tag matches package.json versions
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

  build-desktop:
    name: Build Desktop App (Tauri 2) — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: check-version
    permissions:
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            args: --bundles nsis
            artifact_name: app-windows-release
          - os: macos-14
            label: macOS Universal 2
            args: --target universal-apple-darwin --bundles app,dmg
            artifact_name: app-macos-release
          - os: ubuntu-22.04
            label: Linux x64
            args: --bundles appimage,deb
            artifact_name: app-linux-release
    defaults:
      run:
        shell: bash
    env:
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Prepare Rust targets
        run: |
          rustc --version
          cargo --version
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: release-tauri-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: release-tauri-${{ runner.os }}-

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run canonical Tauri release gates
        run: |
          npm --prefix desktop test
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Require Apple release credentials
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING != 'true'
        run: |
          echo "::error::macOS Tauri releases require signing and notarization credentials."
          echo "::error::Configure MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID."
          exit 1

      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Select the Developer ID signing identity
        if: runner.os == 'macOS'
        run: |
          identity="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Tauri firma l'app con Developer ID e usa le credenziali Apple per
      # notarizzare e fare staple del DMG. Windows e Linux restano unsigned e
      # sono dichiarati tali nelle note e nelle pagine di download.
      - name: Build Tauri bundles
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Gate bundled Google login configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/verify-tauri-login-bundle.py --path desktop/dist

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        run: |
          mkdir -p release-assets
          source="$(find desktop/src-tauri/target/release/bundle/nsis -type f -name '*-setup.exe' -print -quit)"
          test -n "$source"
          cp "$source" release-assets/job-hunter-team-windows-x64-setup.exe

      - name: Collect and verify signed macOS installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          bundle_root=desktop/src-tauri/target/universal-apple-darwin/release/bundle
          source="$(find "$bundle_root/dmg" -type f -name '*.dmg' -print -quit)"
          app="$(find "$bundle_root/macos" -type d -name '*.app' -print -quit)"
          test -n "$source"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$source"
          hdiutil verify "$source"
          cp "$source" release-assets/job-hunter-team-macos-universal.dmg

      - name: Collect and inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          bundle_root=desktop/src-tauri/target/release/bundle
          appimage="$(find "$bundle_root/appimage" -type f -name '*.AppImage' -print -quit)"
          deb="$(find "$bundle_root/deb" -type f -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          cp "$appimage" release-assets/job-hunter-team-linux-x64.AppImage
          cp "$deb" release-assets/job-hunter-team-linux-x64.deb
          chmod +x release-assets/job-hunter-team-linux-x64.AppImage
          extract_dir="$(mktemp -d)"
          (cd "$extract_dir" && "$GITHUB_WORKSPACE/release-assets/job-hunter-team-linux-x64.AppImage" --appimage-extract >/dev/null)
          test -x "$extract_dir/squashfs-root/AppRun"
          dpkg-deb --info release-assets/job-hunter-team-linux-x64.deb >/dev/null

      - name: Gate collected artifact bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets = sorted(p for p in Path("release-assets").iterdir() if p.is_file())
          if not assets or any(p.stat().st_size == 0 for p in assets):
              raise SystemExit(f"missing or empty release assets: {assets}")
          exe = next((p for p in assets if p.suffix == ".exe"), None)
          if exe is not None and exe.read_bytes()[:2] != b"MZ":
              raise SystemExit(f"not a Windows PE executable: {exe}")
          print("release assets:", ", ".join(p.name for p in assets))
          PY

      # Il sidecar nasce sul runner che ha prodotto i byte, dopo packaging e
      # (su macOS) firma/notarizzazione. Il job finale ricalcola tutto.
      - name: Record immutable build identity
        run: |
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          for asset in release-assets/*; do
            python scripts/release_artifacts.py record \
              --asset "$asset" \
              --output "${asset}.provenance.json" \
              --tag "$GITHUB_REF_NAME" \
              --commit "$TAG_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --source-root .
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/

  publish-runtime:
    name: Publish immutable runtime tag
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build-desktop
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Il runtime viene costruito e collaudato sul push master precedente.
      # Il manifest registra quel digest e la sua label revision. Il tag
      # release non ricostruisce byte diversi: promuove il digest attestato,
      # oppure fallisce senza sovrascrivere un tag omonimo divergente.
      - name: Verify source image and publish release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/runtime_image_pin.py verify-tree --root . --version "$version"
          source_revision="$(python scripts/runtime_image_pin.py show --field source_revision)"
          git merge-base --is-ancestor "$source_revision" HEAD
          python scripts/runtime_image_pin.py publish --claim "$GITHUB_REF"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build-desktop
      - publish-runtime
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Ensure tag points to production HEAD
        id: source
        run: |
          git fetch origin production --depth=1
          TAG_SHA=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          PROD_SHA=$(git rev-parse origin/production)
          if [ "$TAG_SHA" != "$PROD_SHA" ]; then
            echo "Tag ${GITHUB_REF_NAME} points to ${TAG_SHA}, but origin/production is ${PROD_SHA}."
            echo "Tag releases only from the current production HEAD."
            exit 1
          fi
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            shared/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Il build web importa shared/config/schema.ts, che dipende da `zod`.
      # Senza le deps di shared installate, turbopack non risolve `zod` da
      # shared/node_modules e il build fallisce (Vercel lo risolve via root
      # npm install). Allineato al job "Build Web" della CI (ci.yml).
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Generate release notes
        id: changelog
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v version="$TAG_VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..HEAD"
            else
              RANGE="HEAD"
            fi
            NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --first-parent)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- Release prepared without curated notes."
          else
            NOTES=$(printf "%s\n" "$NOTES" | sed '/^[[:space:]]*$/d')
          fi

          # Un blocco solo invece di tre redirezioni, e `$GITHUB_OUTPUT` fra
          # virgolette: shellcheck le segnala entrambe (SC2129, SC2086) e da
          # oggi actionlint gira nel workflow di lint, quindi le sue note sono
          # diventate un semaforo rosso invece che un suggerimento.
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download desktop app artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: app-*-release
          path: release-assets
          merge-multiple: true

      - name: Record the runtime manifest as a release asset
        env:
          TAG_SHA: ${{ steps.source.outputs.tag_sha }}
        run: |
          cp release/runtime-image.v1.json release-assets/RUNTIME-IMAGE.json
          python scripts/release_artifacts.py record \
            --asset release-assets/RUNTIME-IMAGE.json \
            --output release-assets/RUNTIME-IMAGE.json.provenance.json \
            --tag "$GITHUB_REF_NAME" \
            --commit "$TAG_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-root .

      - name: Verify tagged artifact provenance and write SHA-256 checksums
        env:
          TAG_SHA: ${{ steps.source.outputs.tag_sha }}
        run: |
          python scripts/release_artifacts.py verify \
            --directory release-assets \
            --expected-asset job-hunter-team-windows-x64-setup.exe \
            --expected-asset job-hunter-team-macos-universal.dmg \
            --expected-asset job-hunter-team-linux-x64.AppImage \
            --expected-asset job-hunter-team-linux-x64.deb \
            --expected-asset RUNTIME-IMAGE.json \
            --tag "$GITHUB_REF_NAME" \
            --commit "$TAG_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --checksums release-assets/SHA256SUMS \
            --provenance release-assets/RELEASE-PROVENANCE.json

      # Il body consuma RELEASE-PROVENANCE.json, già verificato qui sopra:
      # nessuna quinta lista di nomi asset da mantenere nelle release notes.
      - name: Render verified SHA-256 checksums into release notes
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          python scripts/release_artifacts.py notes \
            --notes "$RELEASE_NOTES" \
            --provenance release-assets/RELEASE-PROVENANCE.json \
            --output release-assets/RELEASE-NOTES.md \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Job Hunter Team ${{ github.ref_name }}"
          body_path: release-assets/RELEASE-NOTES.md
          # Gli asset restano invisibili al pubblico finche' HQ-MASTER non li
          # riscarica dalla draft e passa `release_artifacts.py audit`.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/RUNTIME-IMAGE.json
            release-assets/SHA256SUMS
            release-assets/RELEASE-PROVENANCE.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

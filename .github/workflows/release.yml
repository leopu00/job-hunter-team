name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

jobs:
  check-version:
    name: Check tag ↔ package.json versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify tag matches package.json versions
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

  build-game:
    name: Build Desktop App (Godot) — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: check-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            preset: Windows Desktop
            output: builds/windows/job-hunter-team.exe
            artifact_name: app-windows-release
            artifact_path: game/builds/windows/job-hunter-team-windows-x64-setup.exe
            additional_artifact_path: game/builds/windows/job-hunter-team-windows-x64-portable.exe
          - os: macos-14
            label: macOS Universal 2
            preset: macOS
            output: builds/macos/job-hunter-team.zip
            artifact_name: app-macos-release
            artifact_path: game/builds/macos/job-hunter-team.zip
            additional_artifact_path: ""
          - os: ubuntu-22.04
            label: Linux x64
            preset: Linux
            output: builds/linux/job-hunter-team.x86_64
            artifact_name: app-linux-release
            artifact_path: game/builds/linux/job-hunter-team-linux-x64.tar.gz
            additional_artifact_path: ""
    defaults:
      run:
        shell: bash
    env:
      JHT_NOVPS: "1"
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Require Apple release credentials
        if: matrix.os == 'macos-14' && env.HAS_MAC_SIGNING != 'true'
        run: |
          echo "::error::macOS game releases require signing and notarization credentials."
          echo "::error::Configure MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID."
          exit 1

      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        if: matrix.os == 'macos-14' && env.HAS_MAC_SIGNING == 'true'
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      # Stessa lista di `game.yml` (step "Run deterministic game tests"), con
      # UNA sola eccezione, in fondo: terminal_selection_selftest.gd. Un tag non
      # puo' uscire con meno controlli di quelli che ogni push esegue — chi
      # aggiunge un self-test la' lo aggiunge anche qui.
      - name: Import and test game
        run: |
          # Il runner Windows non regge la fila di ~26 avvii di Godot di questo
          # step: il 2026-07-29 e il 2026-07-30 e' uscito in segfault (exit 139)
          # a meta' lista, con i test verdi sopra e sotto e nessun messaggio di
          # fallimento — ogni chiusura lascia dietro "ObjectDB instances were
          # leaked", e prima o poi una di quelle uscite sporche porta giu' il
          # processo. Non e' un test rotto: al rilancio passa. Ma un rosso
          # casuale su un tag rende inutile il semaforo della release, e chi lo
          # legge non ha modo di distinguerlo da un difetto vero.
          #
          # Quindi ogni avvio ha diritto a UN ritentativo su processo pulito,
          # come gia' fanno `game.yml` e `game/tools/run.ps1`. Il ritentativo si
          # vede nel log: se comincia a servire spesso, questa lista va spezzata
          # in piu' job e questo commento e' la traccia per farlo.
          retry_godot() {
            local out code attempt=0
            while : ; do
              attempt=$((attempt + 1))
              if out="$(env "$@" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              else
                # L'`else` non e' decorativo: un `if` bash che non entra nel
                # ramo `then` e non ha `else` esce con stato 0, quindi qui
                # fuori `$?` direbbe "0" e il secondo tentativo tornerebbe
                # VERDE su un test fallito.
                code=$?
              fi
              if [ "$attempt" -ge 2 ]; then
                printf '%s\n' "$out" >&2
                echo "::error::Godot uscito con codice $code dopo due tentativi"
                return "$code"
              fi
              printf '%s\n' "$out" >&2
              echo "::warning::Godot uscito con codice $code — riprovo una volta su processo pulito"
              sleep 10
            done
          }
          python game/tools/title_artifact_contract_selftest.py
          retry_godot godot --headless --path game --import
          retry_godot godot --headless --path game --script res://tools/nav_grid_selftest.gd
          retry_godot godot --headless --path game --script res://tools/speech_bubble_selftest.gd
          retry_godot godot --headless --path game --script res://tools/pipeline_queue_selftest.gd
          retry_godot godot --headless --path game --script res://tools/embedded_terminal_selftest.gd
          # La redazione dei segreti e il bundle di diagnostica: quello che
          # l'utente allega a una segnalazione non deve contenere token, path
          # della sua home o il nome dell'account.
          retry_godot godot --headless --path game --script res://tools/redactor_selftest.gd
          retry_godot godot --headless --path game --script res://tools/diagnostics_selftest.gd
          retry_godot godot --headless --path game --script res://tools/theme_selftest.gd
          retry_godot godot --headless --path game --script res://tools/budget_notice_selftest.gd
          # L'avviso della deroga alla spesa NOMINA i freni che non cedono e il
          # tetto di ore: sono copiati da shared/skills/burn_intent.py, e una
          # copia rimasta indietro promette reti di sicurezza che il modulo non
          # ha piu'. Il test confronta la copia col sorgente.
          retry_godot godot --headless --path game --script res://tools/burn_mode_selftest.gd
          retry_godot godot --headless --path game --script res://tools/doc_preview_selftest.gd
          # La terza via all'uscita ("esci, il team continua") e l'attesa del
          # thread di spegnimento: nessuna delle due si vede a schermo, si
          # sbagliano in silenzio e si scoprono dal container rimasto acceso.
          retry_godot godot --headless --path game --script res://tools/headless_exit_selftest.gd
          # L'aggiornamento automatico, e qui vale doppio: e' il tag che stiamo
          # costruendo a diventare la versione che le copie gia' installate si
          # vedranno proporre. Si aggiorna solo in avanti, si installa da solo
          # solo dove il pacchetto e' firmato, e solo se firmato da chi ha
          # firmato la copia in esecuzione.
          retry_godot godot --headless --path game --script res://tools/update_check_selftest.gd
          # Nessun tag deve uscire con le lingue disallineate: il fallback di
          # UIStrings.t() e' silenzioso, quindi una chiave persa non si vede
          # ne' in CI ne' all'avvio in italiano — solo dall'utente straniero.
          retry_godot godot --headless --path game --script res://tools/i18n_parity_selftest.gd
          # Il patto del riordino della sidebar: le voci raccolte in schede o
          # dietro "Impostazioni" restano raggiungibili e tradotte.
          retry_godot godot --headless --path game --script res://tools/sidebar_nav_selftest.gd
          # I cognomi degli agenti sono identita', non decorazione: mappa pura
          # ruolo+numero, niente omonimi e ogni carattere gia' presente nei
          # font delle 7 lingue (altrimenti a schermo esce un rettangolo).
          retry_godot godot --headless --path game --script res://tools/agent_names_selftest.gd
          # Il costo a riposo: finestra senza focus che disegna di meno, tetto
          # fps del primo piano restituito ALLA LETTERA, passi di fisica che
          # coprono il frame anche a ritmo lento.
          retry_godot godot --headless --path game --script res://tools/idle_pace_selftest.gd
          # (terminal_selection_selftest.gd resta fuori: questo step gira anche
          # su Windows via Git Bash — game.yml lo salta con `runner.os` — e il
          # test apre /bin/sh senza il ramo Windows che ha embedded_terminal.)
          VPS_OUT="$(retry_godot JHT_VPS_CONTRACT_TEST=1 godot --headless --path game --quit-after 3)"
          printf '%s\n' "$VPS_OUT" | grep "VPS-CONTRACT-TEST PASS"
          PIPE_OUT="$(retry_godot JHT_SCENE=office JHT_PIPELINE_FORCE_TEST=scout godot --headless --path game)"
          printf '%s\n' "$PIPE_OUT" | grep "PIPELINE-FORCE-TEST PASS"
          SWITCH_OUT="$(retry_godot JHT_SCENE=office JHT_BACKEND_SWITCH_TEST=1 godot --headless --path game)"
          printf '%s\n' "$SWITCH_OUT" | grep "BACKEND-SWITCH-TEST PASS"
          DOCTOR_OUT="$(retry_godot JHT_SCENE=office JHT_DOCTOR_TEST=scout-4 godot --headless --path game)"
          printf '%s\n' "$DOCTOR_OUT" | grep "SIMULATION-DOCTOR-TEST PASS"
          FEEDBACK_OUT="$(retry_godot JHT_SCENE=office JHT_FEEDBACK_PANEL_TEST=1 godot --headless --path game)"
          printf '%s\n' "$FEEDBACK_OUT" | grep "FEEDBACK-PANEL-TEST PASS"
          GUIDED_OUT="$(retry_godot JHT_SCENE=office JHT_GUIDED_TEST=1 godot --headless --path game)"
          printf '%s\n' "$GUIDED_OUT" | grep "GUIDED-ONBOARDING-TEST PASS"
          # Pausa/ripresa del giro guidato: chi va dritto al setup non deve
          # avere agenti sopra il menu e deve poter tornare alla stessa tappa.
          # Il harness verifica su file sia il gate sia l'indice persistito.
          TOUREXIT_OUT="$(retry_godot JHT_TUTORIAL_HARNESS=1 JHT_TUTORIAL_RESET=1 JHT_SCENE=office JHT_TOUR_EXIT_TEST=1 godot --headless --path game)"
          printf '%s\n' "$TOUREXIT_OUT" | grep "TOUR-EXIT-TEST PASS"
          # La pagina di chat a fumetti: vignette nell'ordine della storia,
          # quella dell'agente bianca col testo nero (richiesta esplicita, non
          # una scelta di tema), il giro utente->canale->risposta che passa dal
          # bus e la rilettura all'indietro che non viene interrotta.
          COMIC_OUT="$(retry_godot JHT_SCENE=office JHT_COMIC_CHAT_TEST=1 godot --headless --path game)"
          printf '%s\n' "$COMIC_OUT" | grep "COMIC-CHAT-TEST PASS"
          GFX_OUT="$(retry_godot JHT_SCENE=office JHT_GFX_TEST=1 godot --headless --path game)"
          printf '%s\n' "$GFX_OUT" | grep "GFX-PROFILE-TEST PASS"
          TEXT_OUT="$(retry_godot JHT_SCENE=office JHT_WORLD_TEXT_TEST=1 godot --headless --path game)"
          printf '%s\n' "$TEXT_OUT" | grep "WORLD-TEXT-TEST PASS"
          GFXPANEL_OUT="$(retry_godot JHT_SCENE=office JHT_GRAPHICS_PANEL_TEST=1 godot --headless --path game)"
          printf '%s\n' "$GFXPANEL_OUT" | grep "GRAPHICS-PANEL-TEST PASS"

      # L'export e' il passo piu' pesante e arriva dopo tutta la lista di test:
      # stessa esposizione dello step precedente, stessa difesa (game.yml la ha
      # dal 2026-07-29). La pausa serve a far chiudere davvero i processi
      # appena usciti prima di aprirne un altro.
      - name: Export native game
        working-directory: game
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"
          sleep 5
          if ! godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"; then
            code=$?
            echo "::warning::export fallito (exit $code) — riprovo una volta su processo pulito"
            rm -f "${{ matrix.output }}"
            sleep 15
            godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          fi
          test -s "${{ matrix.output }}"

      - name: Sign, notarize and staple macOS game
        if: matrix.os == 'macos-14'
        working-directory: game
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGN_DIR="$RUNNER_TEMP/jht-game-sign"
          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"
          ditto -x -k "${{ matrix.output }}" "$SIGN_DIR"
          GAME_APP="$(find "$SIGN_DIR" -type d -name '*.app' | head -n 1)"
          test -n "$GAME_APP"
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" "$GAME_APP"
          codesign --verify --deep --strict --verbose=2 "$GAME_APP"
          rm -f "${{ matrix.output }}"
          ditto -c -k --sequesterRsrc --keepParent "$GAME_APP" "${{ matrix.output }}"
          # `--wait` fa polling in proprio ed esce 1 al PRIMO errore di rete:
          # il 2026-07-27 il runner ha perso la rete dopo 45 minuti di attesa
          # (NSURLErrorDomain -1009) e ha buttato via una submission che era
          # valida. Quel giorno la coda Apple ha impiegato 4h30 — con attese
          # così lunghe un singhiozzo è quasi garantito. Quindi: submit senza
          # attesa, e polling nostro che tollera gli errori di rete e riprova.
          SUBMIT_ID="$(xcrun notarytool submit "${{ matrix.output }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --no-wait --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          test -n "$SUBMIT_ID"
          echo "submission: $SUBMIT_ID"
          NOTARY_STATUS=""
          NET_FAILS=0
          # 5h di finestra (300 × 60s): sotto il limite di 6h del job, sopra
          # la coda peggiore osservata. Gli errori di rete non contano come
          # verdetto: si riprova al giro dopo.
          for _ in $(seq 1 300); do
            if INFO="$(xcrun notarytool info "$SUBMIT_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --output-format json 2>/dev/null)"; then
              NOTARY_STATUS="$(printf '%s' "$INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
              NET_FAILS=0
              echo "notarizzazione: $NOTARY_STATUS"
              case "$NOTARY_STATUS" in
                "Accepted") break ;;
                "In Progress"|"") ;;
                *) echo "Apple ha respinto la submission: $NOTARY_STATUS"
                   xcrun notarytool log "$SUBMIT_ID" --apple-id "$APPLE_ID" \
                     --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                     --team-id "$APPLE_TEAM_ID" || true
                   exit 1 ;;
              esac
            else
              NET_FAILS=$((NET_FAILS + 1))
              echo "interrogazione fallita ($NET_FAILS di fila) — la submission resta viva, riprovo"
              if [ "$NET_FAILS" -ge 20 ]; then
                echo "20 tentativi consecutivi falliti: il runner non raggiunge Apple da 20 minuti."
                exit 1
              fi
            fi
            sleep 60
          done
          if [ "$NOTARY_STATUS" != "Accepted" ]; then
            echo "Notarizzazione non conclusa entro 5h (ultimo stato: ${NOTARY_STATUS:-sconosciuto})."
            echo "La submission $SUBMIT_ID resta valida lato Apple: verificarla con notarytool info."
            exit 1
          fi
          xcrun stapler staple "$GAME_APP"
          xcrun stapler validate "$GAME_APP"
          spctl --assess --type execute --verbose=2 "$GAME_APP"
          rm -f "${{ matrix.output }}"
          ditto -c -k --sequesterRsrc --keepParent "$GAME_APP" "${{ matrix.output }}"

      - name: Smoke-test native game
        working-directory: game
        run: |
          case "${{ runner.os }}" in
            Windows)
              JHT_NOVPS=1 "${{ matrix.output }}" --headless --quit-after 3
              ;;
            Linux)
              chmod +x "${{ matrix.output }}"
              JHT_NOVPS=1 "./${{ matrix.output }}" --headless --quit-after 3
              ;;
            macOS)
              mkdir -p "$RUNNER_TEMP/jht-game"
              ditto -x -k "${{ matrix.output }}" "$RUNNER_TEMP/jht-game"
              GAME_BIN="$(find "$RUNNER_TEMP/jht-game" -type f -path '*/Contents/MacOS/*' | head -n 1)"
              test -n "$GAME_BIN"
              JHT_NOVPS=1 "$GAME_BIN" --headless --quit-after 3
              ;;
          esac

      - name: Preserve Linux executable permissions
        if: runner.os == 'Linux'
        working-directory: game
        run: |
          tar -C builds/linux -czf builds/linux/job-hunter-team-linux-x64.tar.gz \
            job-hunter-team.x86_64

      - name: Build and smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/build-windows-installer.ps1 -Version $version -Smoke
          Copy-Item game/builds/windows/job-hunter-team.exe game/builds/windows/job-hunter-team-windows-x64-portable.exe

      # Questo gate gira sui byte che diventeranno gli asset: portable Windows
      # dopo il packaging NSIS, binario estratto dal tar Linux e app estratta
      # dallo zip macOS gia' firmato/notarizzato. Il selftest costruisce la title
      # vera, pretende il Label visibile e confronta ProjectSettings col tag.
      - name: Gate packaged title footer and version
        working-directory: game
        env:
          EXPECTED_GAME_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_version="${EXPECTED_GAME_VERSION#v}"
          game_bin=""

          case "${{ runner.os }}" in
            Windows)
              game_bin="builds/windows/job-hunter-team-windows-x64-portable.exe"
              ;;
            Linux)
              title_dir="$RUNNER_TEMP/jht-title-artifact-gate"
              mkdir -p "$title_dir"
              tar -xzf builds/linux/job-hunter-team-linux-x64.tar.gz -C "$title_dir"
              game_bin="$title_dir/job-hunter-team.x86_64"
              ;;
            macOS)
              title_dir="$RUNNER_TEMP/jht-title-artifact-gate"
              mkdir -p "$title_dir"
              ditto -x -k builds/macos/job-hunter-team.zip "$title_dir"
              game_bin="$(find "$title_dir" -type f -path '*/Contents/MacOS/*' -print -quit)"
              ;;
          esac
          test -n "$game_bin"
          test -f "$game_bin"

          set +e
          title_out="$(env JHT_NOVPS=1 JHT_LANG= JHT_LANGUAGE_PICKER_TEST=1 \
            JHT_EXPECTED_GAME_VERSION="$expected_version" \
            "$game_bin" --headless 2>&1)"
          title_rc=$?
          set -e
          printf '%s\n' "$title_out"
          test "$title_rc" -eq 0
          printf '%s\n' "$title_out" | tr -d '\r' \
            | grep -Fx "LANGUAGE-PICKER-TITLE-VERSION v${expected_version}"
          printf '%s\n' "$title_out" | tr -d '\r' \
            | grep -Fx "LANGUAGE-PICKER-TITLE-TEST PASS"

      # Il sidecar nasce sullo stesso runner e DOPO firma/notarizzazione e
      # packaging. Il job release ricalcola l'hash dei byte scaricati e rifiuta
      # un asset se tag, commit, dimensione o SHA-256 non coincidono: un file
      # recuperato da un altro run non puo' essere pubblicato per errore.
      - name: Record immutable build identity
        env:
          RELEASE_ASSET: ${{ matrix.artifact_path }}
          ADDITIONAL_RELEASE_ASSET: ${{ matrix.additional_artifact_path }}
        run: |
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          for asset in "$RELEASE_ASSET" "$ADDITIONAL_RELEASE_ASSET"; do
            [ -n "$asset" ] || continue
            python scripts/release_artifacts.py record \
              --asset "$asset" \
              --output "${asset}.provenance.json" \
              --tag "$GITHUB_REF_NAME" \
              --commit "$TAG_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --source-root .
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os != 'Windows'
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.artifact_path }}.provenance.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.artifact_path }}.provenance.json
            ${{ matrix.additional_artifact_path }}
            ${{ matrix.additional_artifact_path }}.provenance.json

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build-game
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Ensure tag points to production HEAD
        id: source
        run: |
          git fetch origin production --depth=1
          TAG_SHA=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          PROD_SHA=$(git rev-parse origin/production)
          if [ "$TAG_SHA" != "$PROD_SHA" ]; then
            echo "Tag ${GITHUB_REF_NAME} points to ${TAG_SHA}, but origin/production is ${PROD_SHA}."
            echo "Tag releases only from the current production HEAD."
            exit 1
          fi
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            shared/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Il build web importa shared/config/schema.ts, che dipende da `zod`.
      # Senza le deps di shared installate, turbopack non risolve `zod` da
      # shared/node_modules e il build fallisce (Vercel lo risolve via root
      # npm install). Allineato al job "Build Web" della CI (ci.yml).
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Generate release notes
        id: changelog
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v version="$TAG_VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..HEAD"
            else
              RANGE="HEAD"
            fi
            NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --first-parent)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- Release prepared without curated notes."
          else
            NOTES=$(printf "%s\n" "$NOTES" | sed '/^[[:space:]]*$/d')
          fi

          # Un blocco solo invece di tre redirezioni, e `$GITHUB_OUTPUT` fra
          # virgolette: shellcheck le segnala entrambe (SC2129, SC2086) e da
          # oggi actionlint gira nel workflow di lint, quindi le sue note sono
          # diventate un semaforo rosso invece che un suggerimento.
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download desktop app artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: app-*-release
          path: release-assets
          merge-multiple: true

      - name: Verify tagged artifact provenance and write SHA-256 checksums
        env:
          TAG_SHA: ${{ steps.source.outputs.tag_sha }}
        run: |
          python scripts/release_artifacts.py verify \
            --directory release-assets \
            --expected-asset job-hunter-team-windows-x64-setup.exe \
            --expected-asset job-hunter-team-windows-x64-portable.exe \
            --expected-asset job-hunter-team.zip \
            --expected-asset job-hunter-team-linux-x64.tar.gz \
            --tag "$GITHUB_REF_NAME" \
            --commit "$TAG_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --checksums release-assets/SHA256SUMS \
            --provenance release-assets/RELEASE-PROVENANCE.json

      # Il body consuma RELEASE-PROVENANCE.json, già verificato qui sopra:
      # nessuna quinta lista di nomi asset da mantenere nelle release notes.
      - name: Render verified SHA-256 checksums into release notes
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          python scripts/release_artifacts.py notes \
            --notes "$RELEASE_NOTES" \
            --provenance release-assets/RELEASE-PROVENANCE.json \
            --output release-assets/RELEASE-NOTES.md \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "Job Hunter Team ${{ github.ref_name }}"
          body_path: release-assets/RELEASE-NOTES.md
          # Gli asset restano invisibili al pubblico finche' HQ-MASTER non li
          # riscarica dalla draft e passa `release_artifacts.py audit`.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/RELEASE-PROVENANCE.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

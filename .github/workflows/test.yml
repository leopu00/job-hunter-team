name: Tests

on:
  push:
    branches:
      - master
      - hq-master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      # A dispatch is how a branch gets its gates before a merge (the CI runs
      # on master only): that run tests the branch, not the live site. The
      # smoke asks for it, and only then.
      smoke:
        description: "Also run the production smoke against the live site"
        type: boolean
        default: false
      # BOZZA in attesa della decisione dell'operatore
      # (e2e contro Supabase locale invece che contro la produzione): il job
      # `e2e-local-supabase` parte solo da un dispatch che lo chiede. Mai su
      # push, PR o cron, finché l'operatore non decide.
      prod_canary:
        description: "Also run the read-only production login canary in smoke (draft)"
        type: boolean
        default: false
      local_supabase_e2e:
        description: "Also run the e2e specs against a local Supabase (draft)"
        type: boolean
        default: false
  # Solo per il job `smoke` (vedi in fondo): i test che interrogano la
  # produzione non appartengono al gate della PR, ma la copertura non si
  # butta — si sposta dove ha senso, cioè dopo il deploy.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  api-worker:
    name: API worker — format, types, offline tests
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api-worker/package-lock.json

      - name: Install API worker dependencies
        working-directory: api-worker
        run: npm ci

      - name: Verify API worker
        working-directory: api-worker
        run: npm run verify

  # Suite vitest completa — l'UNICO posto in cui gira. Fino al 2026-07-26 il
  # job viveva anche in ci.yml (stesso trigger, stesso codice, due esecuzioni)
  # e qui era una matrice `config|tasks|wizard` che si presentava come elenco
  # esaustivo pur omettendo `validators/` (redazione dei dati sensibili nei
  # ticket): la cartella non girava in nessun job della matrice. Niente
  # matrice, niente elenco da tenere allineato a mano: `npm test` prende tutto
  # quello che c'è in tests/js, e un modulo nuovo è coperto il giorno che nasce.
  vitest:
    name: vitest — tests/js
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    # Il cron esiste solo per `smoke`: le suite del codice non hanno motivo di
    # rigirare a vuoto ogni notte sullo stesso commit.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            tests/js/package-lock.json
            web/package-lock.json
            cli/package-lock.json
            shared/package-lock.json
            shared/cron/package-lock.json

      - name: Install test runner dependencies
        working-directory: tests/js
        run: npm ci

      # tasks/demo-*.test.ts importano `@/lib/demo/...` (alias → web/), che a
      # sua volta tira `next/headers`.
      - name: Install web dependencies for imported routes
        working-directory: web
        run: npm ci

      # Static causal bridge only: scans the checked-in web TypeScript and the
      # versioned receipt manifests. It has no credentials and makes no network
      # request, so PRs cannot silently add an RPC/column outside the canary.
      - name: Verify web schema receipt coverage (offline)
        run: node scripts/check-web-schema-coverage.mjs

      # wizard/setup.test.js importa cli/wizard/setup.js e lancia cli/bin/jht.js.
      - name: Install CLI dependencies for imported commands
        working-directory: cli
        run: npm ci

      # config/schema.test.ts importa shared/config/schema.ts → `zod`. Senza
      # questo `npm ci` lo schema veniva validato con la copia di zod di
      # tests/js: fino al 2026-07-26 era la 3.x mentre il prodotto è sulla 4.x,
      # cioè la CI validava lo schema con una libreria che nessuno spedisce.
      - name: Install shared dependencies for imported modules
        working-directory: shared
        run: npm ci

      # tasks/cron.test.ts importa shared/cron/schedule.js → `croner`.
      - name: Install cron dependencies for imported modules
        working-directory: shared/cron
        run: npm ci

      - name: Run tests
        working-directory: tests/js
        run: npm test

  # Il pannello di controllo desktop (Tauri + React): la sua suite vitest e
  # il typecheck non giravano in nessun job. Pacchetto a se' con il suo lock;
  # i moduli puri di web/lib che importa (tipi, regole) non hanno dipendenze,
  # quindi web/ non si installa.
  desktop:
    name: desktop — types, vitest
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck desktop
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

  # Il crate Tauri del desktop ha rami per sistema (#[cfg(target_os = ...)]:
  # browser installati, portachiavi, lancio dei processi). Da un solo sistema
  # gli altri rami non si compilano nemmeno: qui ognuno gira sul suo. Un job a
  # se' e non una matrice su `desktop`: la suite vitest non cambia col sistema.
  desktop-rust:
    name: desktop — Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    if: github.event_name != 'schedule'
    strategy:
      # Tre verdetti separati: un rosso su Windows non deve cancellare Linux
      # e macOS a meta'.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Le librerie di sistema che Tauri 2 linka su Linux (WebKitGTK 4.1 e
      # compagnia); macOS e Windows usano la webview del sistema.
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Rust stable e' gia' sui runner: niente action di terzi per installarlo.
      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-cargo-${{ runner.os }}-

      # --locked: un Cargo.lock non allineato a Cargo.toml e' un rosso, non
      # un lock riscritto in silenzio sul runner.
      # Niente `cargo check --all-targets` prima (tolto il 07/10): il crate ha
      # la lib, il binario e tests/voice_input_contract.rs, tutti con
      # `test = true` e nessun example o bench, quindi `cargo test` li compila
      # tutti, in prova e (lib e binario, per il test di integrazione) in modo
      # normale. Il check rifaceva lo stesso lavoro: ~1 min su Windows, ~2 su
      # Linux (run 37556511810).
      - name: Test desktop crate
        working-directory: desktop/src-tauri
        run: cargo test --locked

  # Il motore della JHT API (agent-harness/runtime): typecheck e suite vitest
  # non giravano in nessun job fino al 27/09, 1213 test mai eseguiti in CI.
  # I test di parita' confrontano gli strumenti portati con le skill Python al
  # commit da cui e' stato preso src/db/schema.sql (`-- source: ...`), estratte
  # con `git archive`: senza quel commit nel checkout SALTANO in silenzio
  # (tests/helpers/python-skills.ts). Per questo la storia intera, e non il
  # solo commit di testa che actions/checkout scarica di default.
  # I pytest di scripts/parity (tests/test_jobsdb_parity.py) stanno gia' in
  # tests/ e girano nel job `pytest`.
  agent-harness:
    name: agent-harness — types, vitest
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: agent-harness/runtime/package-lock.json

      # I test di parita' confrontano il port con le skill Python eseguite dal
      # python3 del runner, e ne confrontano anche i messaggi di argparse, che
      # cambiano fra versioni minori: il 27/09 il python3 di sistema scriveva
      # «(choose from 'new', 'excluded')» come il port, il 3.12 recente di
      # setup-python «(choose from new, excluded)»: 18 rossi che misuravano
      # l'interprete e non il port. Quindi il python3 di sistema, niente
      # setup-python.
      #
      # La toolchain PDF del job `pytest`: parity-pdf-layout (poppler) e
      # render-pdf (pandoc, wkhtmltopdf) saltano senza. Il 27/09 erano 21 dei
      # 22 saltati in CI, contro 1 in locale.
      - name: Install CV PDF toolchain (parity with pdf_layout_check.py)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc wkhtmltopdf poppler-utils
          python3 --version

      # La sandbox di bash (src/tools/sandbox.ts) su Linux e' bubblewrap: senza
      # `bwrap` che parte, i test dal vivo di tests/sandbox.test.ts
      # (describe.runIf(probe.kind !== "none")) saltano tutti, e il confine
      # che il prodotto usa su Linux non verrebbe mai eseguito. Qui si
      # installa bwrap e si permettono i namespace utente non privilegiati
      # (Ubuntu li restringe con AppArmor); l'ultima riga prova ad avviarlo e
      # ne stampa l'esito nel log.
      - name: Install bubblewrap for the bash sandbox
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc true && echo "bwrap starts" || echo "bwrap does NOT start"

      - name: Install agent runtime dependencies
        working-directory: agent-harness/runtime
        run: npm ci

      - name: Typecheck agent runtime
        working-directory: agent-harness/runtime
        run: npx tsc --noEmit

      # --reporter=verbose: ogni test col suo esito, i saltati compresi. Il
      # conto dei saltati si confronta col locale (1): un salto in piu' e' un
      # test che qui non prova niente, e senza nomi non si sa quale.
      - name: Run agent runtime tests
        working-directory: agent-harness/runtime
        run: npx vitest run --reporter=verbose

  # A migration is an immutable release identity, not merely a SQL file that
  # parses today.  This gate compares the exact base tree with HEAD and every
  # freshly fetched remote branch by version/path/Git blob, then applies only
  # the new sequence to a disposable PostgreSQL 16 database.  It never links,
  # repairs, pushes or writes to Supabase.
  migration-gate:
    name: Supabase migrations — immutable history + PostgreSQL 16
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      JHT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tree/blob comparisons and all active remote refs require complete
          # history. The gate itself performs a fresh, quiet read-only fetch.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve immutable migration base
        id: migration-base
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          resolved_base="$(python scripts/migration_gate.py base \
            --event "$GITHUB_EVENT_NAME" \
            --head "$GITHUB_SHA" \
            --push-before "$PUSH_BEFORE_SHA" \
            --pull-request-base "$PULL_REQUEST_BASE_SHA")"
          printf 'sha=%s\n' "$resolved_base" >> "$GITHUB_OUTPUT"

      - name: Check immutable migration identities
        run: >-
          python scripts/migration_gate.py git
          --base "${{ steps.migration-base.outputs.sha }}"
          --head "$GITHUB_SHA"
          --fetch-remote origin

      - name: Apply new migrations on PostgreSQL 16
        run: >-
          python scripts/migration_gate.py pg16
          --base "${{ steps.migration-base.outputs.sha }}"
          --head "$GITHUB_SHA"

  # La suite Python (agenti, skill, sync, installer) girava solo a mano: per
  # tre settimane nessuno ha visto che tests/test_public_installers_sync.py
  # era rosso — il test scritto apposta per fallire in CI sul drift degli
  # installer pubblici. Ora gira qui, allo stesso trigger di vitest.
  pytest:
    name: pytest — agents, skills, sync
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    if: github.event_name != 'schedule'
    # Migration 074 is exercised on PostgreSQL itself: parsing SQL or mocking
    # Supabase cannot prove composite FKs, RLS privileges, row locks or a full
    # transaction rollback. A disposable service keeps that gate executable in
    # CI even when the runner image changes its preinstalled server packages.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      JHT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      # Azioni fissate a SHA (il tag fra commento), come in game.yml: un tag
      # spostato non cambia il job senza un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            tests/requirements-ci.txt
            tests/requirements-app-ci.txt

      # tests/test_cli_{config,status_team}.py lanciano `node cli/bin/jht.js`:
      # senza le dipendenze del CLI (commander) sono 21 fallimenti secchi che
      # non c'entrano nulla con il codice sotto test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            cli/package-lock.json
            shared/package-lock.json
            shared/cron/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      # Il CLI importa da shared/ (runtime/container.js) e shared/cron: senza le
      # loro dipendenze `node cli/bin/jht.js` muore con ERR_MODULE_NOT_FOUND e i
      # test CLI falliscono per un motivo che non c'entra col codice sotto test.
      # In locale non si vede: quelle cartelle hanno già i node_modules.
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Install cron dependencies
        working-directory: shared/cron
        run: npm ci

      # Tutto con versioni e hash, niente scaricato senza: il runner dei test
      # (tests/requirements-ci.txt) e le dipendenze del prodotto con le
      # transitive (tests/requirements-app-ci.txt). Poi requirements.txt, la
      # fonte che usa il Dockerfile, SENZA indice: se chiede una versione che
      # il lock non ha installato, pip non puo' scaricarla e il passo fallisce.
      # Niente `pip install --upgrade pip`: era l'unico download senza hash;
      # resta il pip del Python di setup-python.
      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r tests/requirements-ci.txt
          pip install --require-hashes -r tests/requirements-app-ci.txt
          pip install --no-index -r requirements.txt

      # `tests/test_apply_flow.py` ([JHT-CLOSER]) lancia un Chromium vero: sono
      # i test degli invarianti della candidatura — ricevuta obbligatoria,
      # captcha → blocked_human, nessun dato inventato. Senza browser falliscono
      # al setup; farli saltare quando manca li renderebbe vuoti proprio qui,
      # l'unico posto dove girano per ogni push. Stesso comando del Dockerfile:
      # il browser è legato alla versione del driver pinnata in requirements.txt,
      # quindi la CI prova lo stesso binario che il CLOSER trova nel container.
      - name: Install Playwright browser (Python driver)
        run: python -m playwright install --with-deps --only-shell chromium

      # `tests/test_pdf_layout_check.py` renders CVs with the cv-structure command
      # (pandoc + wkhtmltopdf) and measures them with poppler (pdftotext
      # -bbox-layout, pdffonts): the toolchain the container bakes. PDFs never
      # enter the repo, and skipping here would leave the layout gate untested.
      - name: Install CV PDF toolchain (layout gate)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc wkhtmltopdf poppler-utils

      # `-m "not production"`: 38 dei 806 test (tests/test_vercel_pages.py e
      # tests/test_missing_pages.py) fanno HTTP su https://jobhunterteam.ai e
      # asseriscono per lo più `status != 404`. Non testano il codice della PR:
      # diventano rossi per un incidente di produzione, e verdi-per-skip quando
      # il runner non raggiunge Vercel (le URLError finiscono in pytest.skip).
      # È la stessa cosa che il job `e2e` qui sotto evita di proposito. La
      # copertura non è sparita: gira nel job `smoke`, sul cron.
      #
      # `--timeout=300 --timeout-method=thread`: un test appeso ferma la run
      # dopo cinque minuti, invece di consumare il tetto del job. `-v` e non
      # `-q`: il metodo thread stampa solo gli stack, e quello del thread
      # principale sta nel loop di Playwright; con `-v` pytest scrive il nome
      # di ogni test prima di eseguirlo, quindi il test appeso e' quello sulla
      # riga del «Timeout». Dal 20/09 al 27/09 un solo test fermo (una
      # page.evaluate senza timeout su una pagina che non risponde) ha dato
      # «cancelled» a ogni push su master: quaranta minuti e nessun nome. Il metodo `thread` chiude il
      # processo; `signal` interrompe il test ma lascia Playwright in uno stato
      # che blocca il test successivo. Nelle run del 26/09 il blocco di 72 test
      # più lento ha impiegato 3 minuti e 13 secondi: nessun test sano arriva
      # a cinque.
      #
      # `-n auto` (pytest-xdist): un worker per processore del runner. In un
      # solo processo il job durava 23 minuti (06/10: 4576 test, 1377 s) ed era
      # da solo il collo di bottiglia del run. Ogni worker ha la sua sessione,
      # quindi il suo JHT_HOME temporaneo (tests/conftest.py); i test su
      # PostgreSQL creano ciascuno un database a nome casuale.
      # `--dist loadfile`: un file intero su un solo worker, nel suo ordine.
      # test_tg_bridge_spawn_race.py uccide i bridge per marker su tutto `ps`:
      # due suoi test su due worker si ucciderebbero i processi a vicenda. E le
      # fixture di modulo (un container o un database PostgreSQL per file)
      # partono una volta sola invece che una per worker. Con le durate del
      # 06/10 il file piu' lento (128 s) sta sotto la quota di un worker
      # (~350 s su 4).
      # Fra file, invece, l'ordine non e' piu' quello alfabetico: un file che
      # lascia stato in giro colpisce quelli che prima giravano prima di lui.
      # Il 07/10 la suite e' stata confrontata test per test in sequenza, con
      # i file in ordine inverso e con 4 worker: stessi 4576 test, stessi esiti.
      # Con xdist il test appeso fa cadere il suo worker: la riga «worker 'gwN'
      # crashed while running '<test>'» ne porta il nome, e la run prosegue con
      # un worker nuovo.
      #
      # xdist da solo toglie «N deselected» dalla riga finale: lo rimette
      # tests/conftest.py, cosi' la riga resta confrontabile con quella di un
      # processo solo (06/10: 4499 passed, 66 skipped, 38 deselected,
      # 11 xfailed). Fino al 07/10 lo stampava un passo di sola raccolta, che
      # costava 22 s di job.
      - name: Run pytest
        run: python -m pytest tests/ -v -n auto --dist loadfile -m "not production" --timeout=300 --timeout-method=thread

  # Spec end-to-end. Gira TUTTO ciò che non è in quarantena: le 75 spec
  # storiche testavano un sito che non esiste più (pagine rimosse, plane locale
  # ritirato, `/api/health` cambiato) e stanno in e2e/tests/quarantine/, che il
  # playwright.config esclude — il perché, gruppo per gruppo, è nel README lì
  # dentro. Restano wizard /welcome, demo mode e i metadati social/PWA.
  #
  # Non c'è più un elenco di spec da tenere allineato a mano: una spec nuova in
  # e2e/tests/ gira dal primo push.
  #
  # Contro `next start` (build di produzione) e non `next dev`: niente HMR,
  # quindi niente dipendenza dall'host, ed è la stessa cosa che gira su Vercel.
  e2e:
    name: e2e — welcome wizard, demo mode, social metadata
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    # Senza i segreti dell'account di test l'area riservata non è raggiungibile
    # e i test si skipperebbero in silenzio: meglio non far partire il job.
    if: github.repository == 'leopu00/job-hunter-team' && github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            shared/package-lock.json
            e2e/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Il build del web importa shared/config/schema.ts → serve `zod`.
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # NEXT_PUBLIC_* è inlinata a build time: il deploy mode va deciso qui.
      #
      # NEXT_PUBLIC_SITE_URL punta al server del job perché `metadataBase` ne
      # deriva og:image, canonical e sitemap: senza, il build li assolutizza su
      # https://jobhunterteam.ai e una spec che segue og:image finirebbe a
      # interrogare la produzione — CI che dipende dal sito vivo, cioè rossa
      # quando cade qualcosa che non c'entra con la PR.
      - name: Build web (cloud mode)
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_JHT_DEPLOY: cloud
          NEXT_PUBLIC_SITE_URL: http://localhost:3011

      - name: Start web
        working-directory: web
        run: |
          mkdir -p "$RUNNER_TEMP/empty-jht"
          JHT_HOME="$RUNNER_TEMP/empty-jht" \
          NEXT_PUBLIC_JHT_DEPLOY=cloud \
          NEXT_PUBLIC_SITE_URL=http://localhost:3011 \
          npx next start -p 3011 > "$RUNNER_TEMP/next.log" 2>&1 &
          # Attesa senza dipendenze da scaricare: /api/demo risponde solo a
          # server pronto ed è cloud-only, quindi conferma anche il deploy mode.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3011/api/demo; then
              echo "server pronto dopo ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::il server non ha risposto entro 60s"; cat "$RUNNER_TEMP/next.log"; exit 1

      # Sessione dell'account riservato ai test: login email+password contro
      # /auth/v1/token, nessun browser e nessun OAuth (Google rifiuta i browser
      # automatizzati). Vedi e2e/scripts/refresh-auth-state.mjs.
      - name: Create the test session
        working-directory: e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::E2E_EMAIL/E2E_PASSWORD mancanti: senza sessione i test dell'area riservata si skipperebbero in silenzio."
            exit 1
          fi
          printf 'E2E_EMAIL=%s\nE2E_PASSWORD=%s\n' "$E2E_EMAIL" "$E2E_PASSWORD" > .auth-credentials
          chmod 600 .auth-credentials
          node scripts/refresh-auth-state.mjs

          # Il token nasce durante il job, quindi GitHub non può conoscerlo
          # come secret statico. Registriamo come mask sia il cookie completo
          # sia i token contenuti nel payload: se Playwright stampa il call log
          # di una richiesta fallita, gli header restano comunque redatti.
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const state = JSON.parse(readFileSync("auth-state.json", "utf8"));

          const masks = new Set();
          const addMask = (value) => {
            if (typeof value === "string" && value.length >= 8 && !value.includes("\n")) {
              masks.add(value);
              // Playwright può includere lo stesso valore in URL/query string.
              // GitHub maschera per corrispondenza testuale: registriamo quindi
              // anche le due rappresentazioni percent-encoded più comuni.
              masks.add(encodeURI(value));
              masks.add(encodeURIComponent(value));
            }
          };
          const addSensitiveLeaves = (value) => {
            if (typeof value === "string") {
              addMask(value);
            } else if (Array.isArray(value)) {
              value.forEach(addSensitiveLeaves);
            } else if (value && typeof value === "object") {
              Object.values(value).forEach(addSensitiveLeaves);
            }
          };
          const decodeSession = (encoded) => {
            if (!encoded.startsWith("base64-")) return;
            try {
              const session = JSON.parse(
                Buffer.from(encoded.slice("base64-".length), "base64url").toString("utf8"),
              );
              addMask(JSON.stringify(session));
              addSensitiveLeaves(session);
            } catch {
              // I singoli chunk sono già mascherati. La ricostruzione sotto
              // copre il formato Supabase corrente; un formato futuro non
              // deve trasformare il masking difensivo in un gate rosso.
            }
          };

          addMask(process.env.E2E_EMAIL);
          addMask(process.env.E2E_PASSWORD);

          const cookieGroups = new Map();
          for (const cookie of state.cookies ?? []) {
            addMask(cookie.value);
            const baseName = cookie.name.replace(/\.\d+$/, "");
            const key = `${cookie.domain}\0${baseName}`;
            const group = cookieGroups.get(key) ?? [];
            group.push(cookie);
            cookieGroups.set(key, group);
          }
          for (const group of cookieGroups.values()) {
            group.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            const encoded = group.map((cookie) => cookie.value).join("");
            addMask(encoded);
            decodeSession(encoded);
          }

          for (const origin of state.origins ?? []) {
            for (const item of origin.localStorage ?? []) {
              addMask(item.value);
              try {
                addSensitiveLeaves(JSON.parse(item.value));
              } catch {
                // Il valore completo è già nella mask.
              }
            }
          }

          for (const value of masks) {
            console.log(`::add-mask::${value}`);
          }
          NODE

      - name: Run e2e specs
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3011
        # Gli spec 80/81 mutano la stessa sessione demo. Due worker possono
        # sovrapporre POST/DELETE e bloccare le route server-rendered fino al
        # timeout; un worker rende deterministico il gate autenticato.
        run: npx playwright test --reporter=list --workers=1

      # Le credenziali non devono sopravvivere al job nemmeno in un artifact.
      - name: Wipe the session
        if: always()
        working-directory: e2e
        run: rm -f .auth-credentials auth-state.json

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Report HTML, trace e video possono incorporare header/cookie e non
          # sono sanificabili con ::add-mask::. Sul repo pubblico conserviamo
          # soltanto screenshot di UI sintetica, mai gli archivi di rete.
          name: playwright-failure-screenshots
          path: e2e/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # BOZZA — e2e contro un Supabase LOCALE avviato nel runner (`supabase
  # start`), in attesa della decisione dell'operatore (opzione C della nota
  # sull'Auth di produzione). Stesse spec del job `e2e`, ma: schema = le
  # migrazioni della PR, account di test sintetico creato qui con una password
  # generata a ogni run, nessun segreto e nessuna chiamata alla produzione.
  # Il job `e2e` sopra resta com'è; questo parte SOLO da un dispatch con
  # `local_supabase_e2e: true`.
  e2e-local-supabase:
    name: e2e — local Supabase (draft, dispatch only)
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla.
    timeout-minutes: 40
    if: >-
      github.repository == 'leopu00/job-hunter-team' &&
      github.event_name == 'workflow_dispatch' && inputs.local_supabase_e2e
    env:
      E2E_EMAIL: e2e@example.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            shared/package-lock.json
            e2e/package-lock.json

      # DA FISSARE: il resto del file pinna le action per tag di major
      # (checkout@v7, setup-node@v7), non per SHA; la versione della CLI va
      # fissata a una release precisa prima di rendere il job un gate.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Il build del web importa shared/config/schema.ts → serve `zod`.
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Solo db, Auth (gotrue), PostgREST, Realtime, Storage e il gateway
      # (kong). Storage resta: 037_file_bridge scrive in storage.buckets.
      # Realtime resta: il web si iscrive ai canali lato browser.
      # Il progetto locale NON sta nella radice di supabase/: un config.toml lì
      # lo leggerebbe ogni comando della CLI lanciato dal repo, anche sul
      # progetto collegato (migration list --linked, config push). La cartella
      # di lavoro nasce qui, nel temp del runner: config.toml da
      # supabase/e2e-local/ e le migrazioni vere copiate accanto.
      - name: Prepare the local Supabase workdir
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/supabase-e2e"
          mkdir -p "$W/supabase"
          cp supabase/e2e-local/config.toml "$W/supabase/config.toml"
          cp -R supabase/migrations "$W/supabase/migrations"
          echo "SUPABASE_E2E_WORKDIR=$W" >> "$GITHUB_ENV"

      # `supabase start` applica le migrazioni copiate (config.toml:
      # [db.migrations]); il seed storico è spento ([db.seed] enabled=false).
      - name: Start local Supabase (migrations applied)
        run: >-
          supabase --workdir "$SUPABASE_E2E_WORKDIR" start
          -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta

      # `status -o env` stampa API_URL, ANON_KEY, SERVICE_ROLE_KEY, DB_URL
      # dello stack locale: chiavi generate dalla CLI, non segreti del repo.
      # La password dell'account sintetico nasce qui, a ogni run.
      - name: Export local Supabase env
        run: |
          set -euo pipefail
          eval "$(supabase --workdir "$SUPABASE_E2E_WORKDIR" status -o env)"
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            if [ -z "${!v:-}" ]; then
              echo "::error::supabase status non ha stampato $v"; exit 1
            fi
          done
          case "$API_URL" in
            http://127.0.0.1:*) ;;
            *) echo "::error::API_URL inattesa: $API_URL"; exit 1 ;;
          esac
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "LOCAL_SUPABASE_URL=$API_URL"
            echo "LOCAL_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "LOCAL_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "LOCAL_SUPABASE_DB_URL=$DB_URL"
            echo "E2E_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Seed the synthetic test account
        env:
          API_URL: ${{ env.LOCAL_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}
          DB_URL: ${{ env.LOCAL_SUPABASE_DB_URL }}
        run: bash supabase/e2e-local/seed.sh

      # Come nel job `e2e`, più URL e anon key dello stack locale: senza, il
      # codice cade sul default di produzione (web/lib/supabase/config.ts).
      - name: Build web (cloud mode, local Supabase)
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_JHT_DEPLOY: cloud
          NEXT_PUBLIC_SITE_URL: http://localhost:3011
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}

      - name: Start web
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/empty-jht"
          JHT_HOME="$RUNNER_TEMP/empty-jht" \
          NEXT_PUBLIC_JHT_DEPLOY=cloud \
          NEXT_PUBLIC_SITE_URL=http://localhost:3011 \
          npx next start -p 3011 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3011/api/demo; then
              echo "server pronto dopo ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::il server non ha risposto entro 60s"; cat "$RUNNER_TEMP/next.log"; exit 1

      # Stesso script del job `e2e`, puntato allo stack locale via env. Il
      # cookie si chiama sb-127-auth-token (primo pezzo dell'host), lo stesso
      # nome che @supabase/ssr ricava dall'URL: se non è così lo script ha
      # letto il default di produzione, e il job si ferma.
      - name: Create the test session (local Auth)
        working-directory: e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          node scripts/refresh-auth-state.mjs
          if ! grep -q '"name": "sb-127-auth-token' auth-state.json; then
            echo "::error::la sessione non viene dallo stack locale"; exit 1
          fi

      - name: Run e2e specs
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3011
        run: npx playwright test --reporter=list --workers=1

      - name: Wipe the session and stop Supabase
        if: always()
        run: |
          rm -f e2e/auth-state.json
          supabase --workdir "$SUPABASE_E2E_WORKDIR" stop --no-backup || true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Solo screenshot: account e dati sono sintetici, ma la regola del
          # repo pubblico resta la stessa del job `e2e`.
          name: playwright-local-supabase-failure-screenshots
          path: e2e/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Smoke post-deploy: i 38 test `@pytest.mark.production` che il job `pytest`
  # non esegue più. Non sono stati cancellati, sono stati spostati dove la loro
  # domanda ha senso — «il sito vivo risponde?» è una domanda sul deploy, non
  # sulla PR. Qui un rosso significa davvero che la produzione è rotta, e non
  # blocca nessuno che stia solo cercando di fare merge.
  #
  # Cron, o workflow_dispatch con `smoke: true`: sulle PR resta escluso, e
  # anche sui dispatch che fanno da gate a un ramo. Ogni dispatch lo lanciava:
  # il 27/09 una quarantina, e ciascuno chiedeva /positions/not-a-real-uuid-0000
  # al sito vivo, cioe' quattro ERROR 22P02 nel log di Postgres di produzione
  # (~80 l'ora nelle ore di lavoro) per verificare il sito, non il ramo.
  smoke:
    name: smoke — produzione (post-deploy)
    runs-on: ubuntu-latest
    # Un job che si appende non e' un verdetto: senza questo tetto il blocco
    # resta in coda fino alle sei ore del runner e la CI non dice nulla — il
    # 21/09 e' successo per diciannove ore, con Lint e CI verdi accanto.
    timeout-minutes: 40
    if: >-
      github.repository == 'leopu00/job-hunter-team' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.smoke))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Lo stesso runner, con versioni e hash, del job `pytest`.
      - name: Install pytest
        run: pip install --require-hashes -r tests/requirements-ci.txt

      # `-p no:randomly` non serve: questi test non condividono stato. Serve
      # invece `-rs`: le URLError diventano `pytest.skip`, e uno smoke tutto
      # skippato è indistinguibile da uno verde se non si stampano i motivi.
      - name: Run production smoke
        env:
          VERCEL_URL: https://jobhunterteam.ai
        # Censimento esplicito: questi sono i due moduli production (38 test).
        # Raccogliere tutta tests/ importa anche moduli non selezionati dal
        # marker e rende lo smoke dipendente dalle librerie del container
        # (per esempio PyYAML) prima ancora di interrogare il sito vivo.
        run: >-
          python -m pytest
          tests/test_vercel_pages.py
          tests/test_missing_pages.py
          -v -rs -m production

      # Canarino di produzione, SOLA LETTURA (opzione E della nota sull'Auth
      # di produzione): login dell'account di test, /dashboard reso sul sito
      # vivo, logout con scope=local e verifica che il token non valga più.
      # La spec sta in e2e/canary/, fuori da e2e/tests/: il job `e2e` non la
      # raccoglie mai. Gira anche se lo smoke pytest sopra è rosso: sono due
      # domande diverse.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.prod_canary }}
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install production canary dependencies
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.prod_canary }}
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Production auth canary (read-only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.prod_canary }}
        working-directory: e2e
        env:
          E2E_PROD_CANARY: "1"
          BASE_URL: https://jobhunterteam.ai
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test -c canary/playwright.config.ts --reporter=list

name: T204 Godot context proof only
run-name: T204 Godot context v2 (no promotion)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t204-godot-context-${{ github.sha }}
  cancel-in-progress: false
jobs:
  support-context:
    name: Real Godot support context and mutant
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PAYLOAD_SHA: 16f208cd79c0ced1df7d7e4428b900d380c7c780
    steps:
      - name: Checkout the proof driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attest and stage the exact owner recipe
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/t204-supports-driver"
          mkdir -p "$meta"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git rev-parse HEAD 'HEAD^{tree}' | tee "$meta/driver.txt"
          recipe=.github/scripts/t204-godot-context-v2.sh
          printf '%s  %s\n' 713fcdb407946a0ad2392ee9cf1c18e46f5a1bebc96ef16ca0b5bc166bc41d4b "$recipe" | sha256sum -c -
          cp "$recipe" "$meta/exact-recipe.sh"
          sha256sum "$meta/exact-recipe.sh" > "$meta/recipe.sha256"
      - name: Checkout the immutable payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PAYLOAD_SHA }}
          path: payload
          persist-credentials: false
      - name: Attest source HEAD and tree
        working-directory: payload
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PAYLOAD_SHA" ]
          [ "$(git rev-parse 'HEAD^{tree}')" = 35c1c14020da1605aad67eaf4076d963a48d2d46 ]
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ]
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/t204-supports-driver/source-before.txt"
      - name: Install and attest the official Godot binary
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/t204-godot-toolchain"
          mkdir -p "$toolchain"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 \
            https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip \
            -o "$toolchain/godot.zip"
          printf '%s  %s\n' 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c "$toolchain/godot.zip" | sha256sum -c -
          unzip -q "$toolchain/godot.zip" -d "$toolchain"
          mv "$toolchain/Godot_v4.7-stable_linux.x86_64" "$toolchain/godot"
          chmod 755 "$toolchain/godot"
          printf '%s  %s\n' f85bbc6b15e22416c7d797cd60b63286dd67b9cb13498847056c18520ae55a75 "$toolchain/godot" | sha256sum -c -
          sha256sum "$toolchain/godot.zip" "$toolchain/godot" > "$RUNNER_TEMP/t204-supports-driver/godot.sha256"
          "$toolchain/godot" --version | tee "$RUNNER_TEMP/t204-supports-driver/godot-version.txt"
          grep -Fx '4.7.stable.official.5b4e0cb0f' "$RUNNER_TEMP/t204-supports-driver/godot-version.txt"
          printf '%s\n' "$toolchain" >> "$GITHUB_PATH"
      - name: Execute the exact context recipe
        working-directory: payload
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/t204-supports-driver/exact-recipe.sh" 2>&1 | tee "$RUNNER_TEMP/t204-supports-driver/command.log"
      - name: Retain actual pure generated files and attest source again
        if: always()
        working-directory: payload
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/t204-supports-driver"
          git rev-parse HEAD 'HEAD^{tree}' > "$meta/source-after.txt"
          cmp "$meta/source-before.txt" "$meta/source-after.txt"
          git diff --exit-code HEAD
          git ls-tree -r --name-only "$PAYLOAD_SHA" game | LC_ALL=C sort > "$meta/tracked-game-paths.txt"
          find game -type f | LC_ALL=C sort > "$meta/actual-game-paths.txt"
          comm -13 "$meta/tracked-game-paths.txt" "$meta/actual-game-paths.txt" > "$meta/pure-generated-paths.txt"
          tar --verbatim-files-from -czf "$meta/pure-generated.tar.gz" -T "$meta/pure-generated-paths.txt"
          if [ -s game/.godot/global_script_class_cache.cfg ]; then
            sha256sum game/.godot/global_script_class_cache.cfg > "$meta/pure-class-cache.sha256"
          fi
      - name: Preserve all owner evidence and actual generated cache on any outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t204-godot-context-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/t204-supports-context.*/
            ${{ runner.temp }}/t204-supports-driver/

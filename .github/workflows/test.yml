name: T204 focused QA only
run-name: T204 ${{ inputs.probe }} proof (no promotion)
on:
  workflow_dispatch:
    inputs:
      probe:
        description: One authorized owner scope, with its immutable payload
        required: true
        type: choice
        options:
          - foundations
          - godot
          - capture
permissions:
  contents: read
concurrency:
  group: t204-focused-${{ github.sha }}-${{ inputs.probe }}
  cancel-in-progress: false
jobs:
  focused-proof:
    name: ${{ inputs.probe }} only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PROBE_KIND: ${{ inputs.probe }}
      PAYLOAD_SHA: ${{ inputs.probe == 'capture' && 'b4d6ff81ca9fcec0dbd8ade36a4fedcdf91f2d1b' || '16f208cd79c0ced1df7d7e4428b900d380c7c780' }}
    steps:
      - name: Checkout the workflow driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attest and stage the exact owner recipe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t204-gate-meta"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/t204-gate-meta/workflow-sha.txt"
          printf '%s\n' "$PAYLOAD_SHA" > "$RUNNER_TEMP/t204-gate-meta/payload-sha.txt"
          printf '%s\n' "$PROBE_KIND" > "$RUNNER_TEMP/t204-gate-meta/probe.txt"
          case "$PROBE_KIND" in
            godot) expected=a5e4c7bddd493daadbbcb1336fe4fcc5d1d2fa0b9a878e7f2816c67fb37bad9a ;;
            foundations) expected=417a55979d0ce53d2bb7cdd8a07c8c495dd0b1bc5f9df1fb8de02bfdf6c6ccb9 ;;
            capture) expected=f58fd98a85a0d545e3d6d2ff75492cb4f4776b5e8c3fd1d7951c044d0b5c49e6 ;;
            *) exit 2 ;;
          esac
          recipe=".github/scripts/t204-${PROBE_KIND}-recipe.sh"
          printf '%s  %s\n' "$expected" "$recipe" | sha256sum -c -
          cp "$recipe" "$RUNNER_TEMP/t204-gate-meta/exact-recipe.sh"
          sha256sum "$RUNNER_TEMP/t204-gate-meta/exact-recipe.sh" > "$RUNNER_TEMP/t204-gate-meta/recipe.sha256"
          cat "$RUNNER_TEMP/t204-gate-meta/workflow-sha.txt" "$RUNNER_TEMP/t204-gate-meta/payload-sha.txt" "$RUNNER_TEMP/t204-gate-meta/recipe.sha256"
      - name: Checkout the immutable payload separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PAYLOAD_SHA }}
          path: payload
          persist-credentials: false
      - name: Attest actual source HEAD and tree
        working-directory: payload
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PAYLOAD_SHA" ]
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/t204-gate-meta/actual-source.txt"
          git diff --exit-code HEAD
          git status --porcelain
      - name: Set up Node for the requested Node scopes
        if: inputs.probe != 'godot'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Set up Python for the requested Python scopes
        if: inputs.probe != 'godot'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install hash-pinned test dependencies
        if: inputs.probe != 'godot'
        working-directory: payload
        run: python3 -m pip install --require-hashes -r tests/requirements-ci.txt
      - name: Install only the foundation packages
        if: inputs.probe == 'foundations'
        working-directory: payload
        run: |
          set -euo pipefail
          npm ci --no-audit --prefix tests/js
          npm ci --no-audit --prefix cli
          npm ci --no-audit --prefix web
      - name: Install and attest the official Godot binary
        if: inputs.probe == 'godot'
        run: |
          set -euo pipefail
          task_godot_dir="$RUNNER_TEMP/godot-official-toolchain"
          mkdir -p "$task_godot_dir"
          task_godot_archive="$task_godot_dir/godot.zip"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 \
            https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip \
            -o "$task_godot_archive"
          printf '%s  %s\n' 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c "$task_godot_archive" | sha256sum -c -
          sha256sum "$task_godot_archive" > "$RUNNER_TEMP/t204-gate-meta/godot-archive.sha256"
          unzip -q "$task_godot_archive" -d "$task_godot_dir"
          mv "$task_godot_dir/Godot_v4.7-stable_linux.x86_64" "$task_godot_dir/godot"
          chmod 755 "$task_godot_dir/godot"
          sha256sum "$task_godot_dir/godot" | tee "$RUNNER_TEMP/t204-gate-meta/godot-binary.sha256"
          "$task_godot_dir/godot" --version | tee "$RUNNER_TEMP/t204-gate-meta/godot-version.txt"
          grep -Eq '^4\.7\.stable([.]|$)' "$RUNNER_TEMP/t204-gate-meta/godot-version.txt"
          printf '%s\n' "$task_godot_dir" >> "$GITHUB_PATH"
      - name: Execute the exact owner recipe and retain its exit status
        working-directory: payload
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PAYLOAD_SHA" ]
          bash "$RUNNER_TEMP/t204-gate-meta/exact-recipe.sh" 2>&1 | tee "$RUNNER_TEMP/t204-gate-meta/command.log"
      - name: Preserve evidence even when the proof fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t204-${{ inputs.probe }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/t204-gate-meta/
            ${{ runner.temp }}/t204-supports.*/canonical-*.sha256
            ${{ runner.temp }}/t204-supports.*/helper-matrix.txt
            ${{ runner.temp }}/t204-supports.*/pure-*.log
            ${{ runner.temp }}/t204-supports.*/mutant-*.log
            ${{ runner.temp }}/t204-supports.*/mutant-inputs.sha256
            ${{ runner.temp }}/t204-foundations-*
            ${{ runner.temp }}/t204-read-kinds*
            ${{ runner.temp }}/t204-g5-*
            ${{ runner.temp }}/t204-python-tests.log
            ${{ runner.temp }}/t204-asset-gate.log

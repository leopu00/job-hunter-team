name: T204 foundation types only proof
run-name: T204 foundation types only (no promotion)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t204-foundation-types-only-${{ github.sha }}
  cancel-in-progress: false
jobs:
  types-only:
    name: Foundation types only on immutable payload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PAYLOAD_SHA: 16f208cd79c0ced1df7d7e4428b900d380c7c780
    steps:
      - name: Checkout the proof driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attest and stage the exact owner recipe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t204-foundations-types-only-meta"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/t204-foundations-types-only-meta/driver.txt"
          recipe=.github/scripts/t204-foundations-types-only-recipe.sh
          printf '%s  %s\n' ee31224c65660739d44cac6e0c3209866a8c2326f9092f5dd54b99732b5dac6d "$recipe" | sha256sum -c -
          cp "$recipe" "$RUNNER_TEMP/t204-foundations-types-only-meta/exact-recipe.sh"
          sha256sum "$RUNNER_TEMP/t204-foundations-types-only-meta/exact-recipe.sh"
      - name: Checkout the immutable source payload separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PAYLOAD_SHA }}
          path: payload
          persist-credentials: false
      - name: Attest source HEAD and tree
        working-directory: payload
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PAYLOAD_SHA" ]
          [ "$(git rev-parse 'HEAD^{tree}')" = 35c1c14020da1605aad67eaf4076d963a48d2d46 ]
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/t204-foundations-types-only-meta/source.txt"
          git diff --exit-code HEAD
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ]
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install the declared foundation packages
        working-directory: payload
        run: |
          set -euo pipefail
          npm ci --no-audit --prefix tests/js
          npm ci --no-audit --prefix cli
          npm ci --no-audit --prefix web
      - name: Run only the exact type check recipe
        working-directory: payload
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/t204-foundations-types-only-meta/exact-recipe.sh" 2>&1 | tee "$RUNNER_TEMP/t204-foundations-types-only-meta/command.log"
      - name: Preserve all evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t204-foundations-types-only-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/t204-foundations-types-only*

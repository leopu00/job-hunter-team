name: Image source shutdown QA only
run-name: Image source isolated shutdown proof (no promotion)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-source-shutdown-${{ github.sha }}
  cancel-in-progress: false
jobs:
  shutdown:
    name: Real Godot isolated shutdown and order
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: 9fb5fbf93218e0534da358e29f353f20668f0bd4
      SOURCE_TREE: 13f5206fdbab04bd6794b3dcb6cfe8f375e727b4
    steps:
      - name: Checkout the proof driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attest and stage the observer
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/image-shutdown-proof"
          mkdir -p "$proof/bin" "$proof/native" "$proof/fixtures"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git rev-parse HEAD 'HEAD^{tree}' | tee "$proof/driver.txt"
          observer=.github/scripts/shutdown-godot-observer.py
          printf '%s  %s\n' 47fbbee1bd2210c7dd85f556fbd30438cfdfe225af9ae6efa8e633122c2e7aba "$observer" | sha256sum -c -
          cp "$observer" "$proof/bin/godot"
          chmod 755 "$proof/bin/godot"
          sha256sum "$proof/bin/godot" > "$proof/observer.sha256"
          printf '%s\n' "JHT_SHUTDOWN_FIXTURE_ROOT=$proof/fixtures" "JHT_SHUTDOWN_NATIVE_LOGS=$proof/native" >> "$GITHUB_ENV"
          printf '%s\n' "$proof/bin" >> "$GITHUB_PATH"
      - name: Checkout the immutable image source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install declared Python dependencies
        working-directory: source
        run: python3 -m pip install --require-hashes -r tests/requirements-ci.txt
      - name: Install and attest official Godot
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/image-shutdown-toolchain"
          mkdir -p "$toolchain"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 \
            https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip \
            -o "$toolchain/godot.zip"
          printf '%s  %s\n' 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c "$toolchain/godot.zip" | sha256sum -c -
          unzip -q "$toolchain/godot.zip" -d "$toolchain"
          real="$toolchain/Godot_v4.7-stable_linux.x86_64"
          chmod 755 "$real"
          printf '%s  %s\n' f85bbc6b15e22416c7d797cd60b63286dd67b9cb13498847056c18520ae55a75 "$real" | sha256sum -c -
          sha256sum "$toolchain/godot.zip" "$real" > "$RUNNER_TEMP/image-shutdown-proof/godot.sha256"
          "$real" --version | tee "$RUNNER_TEMP/image-shutdown-proof/godot-version.txt"
          grep -Fx '4.7.stable.official.5b4e0cb0f' "$RUNNER_TEMP/image-shutdown-proof/godot-version.txt"
          printf '%s\n' "JHT_REAL_GODOT=$real" >> "$GITHUB_ENV"
      - name: Run whole shutdown QA files and retain native evidence
        working-directory: source
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/image-shutdown-proof"
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE" ]
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ]
          git rev-parse HEAD 'HEAD^{tree}' | tee "$proof/source-before.txt"
          inputs=(tests/test_shutdown_delivery_dialog.py tests/test_app_exit_order.py tests/test_shutdown_order_census.py game/scripts/ui/shutdown_dialog.gd game/scripts/setup/graceful_shutdown_request.gd game/tools/shutdown_delivery_selftest.gd game/scripts/setup/setup_service.gd desktop/src-tauri/src/app_exit.rs agents/_skills/graceful-shutdown/SKILL.md)
          sha256sum "${inputs[@]}" > "$proof/source-before.sha256"
          set +e
          python3 -m pytest -q -rA tests/test_shutdown_delivery_dialog.py tests/test_app_exit_order.py tests/test_shutdown_order_census.py \
            --basetemp "$JHT_SHUTDOWN_FIXTURE_ROOT" --junitxml "$proof/junit.xml" > "$proof/pytest.log" 2>&1
          test_rc=$?
          set -e
          printf '%s\n' "$test_rc" > "$proof/pytest.exit"
          cat "$proof/pytest.log"
          sha256sum "${inputs[@]}" > "$proof/source-after.sha256"
          cmp "$proof/source-before.sha256" "$proof/source-after.sha256"
          git rev-parse HEAD 'HEAD^{tree}' > "$proof/source-after.txt"
          cmp "$proof/source-before.txt" "$proof/source-after.txt"
          git diff --exit-code HEAD
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ]
          python3 - <<'PY_VERIFY'
          import ast, collections, json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          proof = Path(os.environ['RUNNER_TEMP']) / 'image-shutdown-proof'
          source_files = ['tests/test_shutdown_delivery_dialog.py', 'tests/test_app_exit_order.py', 'tests/test_shutdown_order_census.py']
          expected = collections.Counter(node.name for name in source_files for node in ast.parse(Path(name).read_text()).body if isinstance(node, ast.FunctionDef) and node.name.startswith('test_'))
          cases = list(ET.parse(proof / 'junit.xml').iter('testcase'))
          assert len(cases) == 5 and collections.Counter(case.attrib['name'] for case in cases) == expected
          assert not any(case.find(kind) is not None for case in cases for kind in ['failure', 'error', 'skipped'])
          receipts = [json.loads(path.read_text()) for path in (proof / 'native').glob('*.json')]
          assert len(receipts) == 2 and sum(record['importing'] for record in receipts) == 1
          assert all(record['native_exit'] == 0 and not record['diagnostics'] and record['class_cache_ok'] for record in receipts)
          assert all(record['shutdown_pass_marker'] for record in receipts if not record['importing'])
          (proof / 'verification.json').write_text(json.dumps({'cases': [case.attrib for case in cases], 'native_receipts': receipts, 'valid': True}, indent=2) + '\n')
          print('SHUTDOWN_SOURCE_PROOF: 5 Python cases passed, real fresh import and shutdown PASS, zero unexpected diagnostics')
          PY_VERIFY
          exit "$test_rc"
      - name: Preserve the complete proof directory even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-shutdown-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/image-shutdown-proof/

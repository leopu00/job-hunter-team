name: Windows installer smoke

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/windows-installer-smoke.yml"
      - "game/export_presets.cfg"
      - "game/installer/**"
      - "game/project.godot"
      - "scripts/build-windows-installer.ps1"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/windows-installer-smoke.yml"
      - "game/export_presets.cfg"
      - "game/installer/**"
      - "game/project.godot"
      - "scripts/build-windows-installer.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    name: NSIS per-user install and uninstall
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Export portable Windows application
        # `setup-godot` exposes `godot` as a Bash shim on Windows. Invoking it
        # from PowerShell does not reliably populate `$LASTEXITCODE` (the first
        # live run returned an empty value after a successful executable
        # lookup), so use the same shell and project-relative export contract
        # already proven by game.yml/release.yml.
        shell: bash
        working-directory: game
        run: |
          set -euo pipefail
          mkdir -p builds/windows
          godot --headless --path . --import
          # [WIN-USERDIR-ORPHANED-BY-RENAME] L'export collauda un nome
          # visibile diverso da quello storico. Il binario deve continuare a
          # scrivere user:// nella cartella esistente, verificata dopo il
          # launch da build-windows-installer.ps1.
          python - <<'PY'
          from pathlib import Path

          project = Path("project.godot")
          source = project.read_text(encoding="utf-8")
          old = 'config/name="Job Hunter Team"'
          new = 'config/name="Job Hunter Team Rename Probe"'
          if source.count(old) != 1:
              raise SystemExit("project name seam changed: rename probe not applied")
          project.write_text(source.replace(old, new), encoding="utf-8")
          PY
          godot --headless --path . \
            --export-release 'Windows Desktop' \
            builds/windows/job-hunter-team.exe
          test -s builds/windows/job-hunter-team.exe

      # Questo job collauda il candidato ma non lo carica come artifact e non
      # modifica release.yml: pubblicare installer + portable resta una scelta
      # esplicita dell'operatore.
      - name: Build, install, launch and uninstall NSIS candidate
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/build-windows-installer.ps1 -Version $version -Smoke

name: Game — Native desktop matrix

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/game.yml"
  pull_request:
    branches:
      - master
    paths:
      - "game/**"
      - ".github/workflows/game.yml"
  workflow_dispatch:

jobs:
  test-export:
    name: ${{ matrix.label }} — test, export, smoke
    runs-on: ${{ matrix.os }}
    # 30 -> 45: gli avvii di Godot per job passano da ~26 a ~49 (i 15 selftest
    # del tier `watch` che nessuna CI eseguiva, piu' l'import che run.sh fa da
    # se'). Il margine serve a non far scadere il job proprio mentre osserviamo
    # i test nuovi: un timeout si legge come un rosso di quei test, e non lo e'.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            preset: Windows Desktop
            output: builds/windows/job-hunter-team.exe
            artifact: game-windows-x64
            artifact_path: game/builds/windows/job-hunter-team.exe
          - os: macos-14
            label: macOS Universal 2
            preset: macOS
            output: builds/macos/job-hunter-team.zip
            artifact: game-macos-universal
            artifact_path: game/builds/macos/job-hunter-team.zip
          - os: ubuntu-22.04
            label: Linux x64
            preset: Linux
            output: builds/linux/job-hunter-team.x86_64
            artifact: game-linux-x64
            artifact_path: game/builds/linux/job-hunter-team-linux-x64.tar.gz
    defaults:
      run:
        shell: bash
    env:
      JHT_NOVPS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Import and parse project
        run: godot --headless --path game --import

      # La lista dei test NON e' piu' qui: vive in `game/tools/test-matrix.txt`,
      # unica fonte consumata anche da run.sh e da run.ps1. Prima del
      # 2026-07-30 esistevano tre copie divergenti e 15 selftest su 45 non
      # venivano eseguiti da nessuna CI, fra cui quelli scritti apposta per il
      # TOUR v3 e per il wizard: il `game/README.md` prometteva piu' di quanto
      # questo semaforo controllasse.
      - name: Run deterministic game tests (gate)
        if: runner.os != 'Windows'
        run: bash game/tools/run.sh test gate

      - name: Run deterministic game tests through PowerShell (gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $GodotExe = Get-ChildItem (Join-Path $HOME "godot") -Filter "Godot*.exe" -File |
            Select-Object -First 1
          if (-not $GodotExe) { throw "setup-godot executable not found" }
          $env:JHT_GODOT_BIN = $GodotExe.FullName
          ./game/tools/run.ps1 test gate

      # --------------------------- TIER `watch` - IN OSSERVAZIONE, NON ROTTO --
      # Questi test (marcati `watch` in game/tools/test-matrix.txt) sono verdi
      # in locale - triage 2026-07-30, Godot 4.7 stable su macOS: 18 su 18 PASS
      # - ma non hanno MAI girato su un runner pulito. Renderli bloccanti in un
      # colpo solo significherebbe scoprire su master, e a valle di una PR
      # innocente, se dipendono da `~/.jht`, dal tempo di boot o dal numero di
      # core del runner.
      #
      # `continue-on-error: true` NON vuol dire "ignorati": il passo compare nel
      # riepilogo del job con il suo esito, e il runner esegue TUTTA la lista
      # anche dopo un rosso, proprio per dare il quadro completo che serve a
      # promuoverli.
      #
      # PER TOGLIERE `continue-on-error`: servono ~10 esecuzioni consecutive
      # verdi sui tre OS (Windows compreso - li' la catena di avvii Godot e'
      # gia' andata in ACCESS_VIOLATION due volte). Poi si sposta la voce da
      # `watch` a `gate` in test-matrix.txt, a scaglioni e non tutta insieme; e
      # quando il tier `watch` resta vuoto questi due passi si cancellano.
      # ATTENZIONE: promuovendo `coordinator_policy` vanno aggiunti al `paths:`
      # in cima anche `shared/skills/enrichment_policy.py` e
      # `shared/skills/db_query.py`.
      - name: Run game tests under observation (watch - non blocking)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: bash game/tools/run.sh test watch

      - name: Run game tests under observation through PowerShell (watch - non blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $GodotExe = Get-ChildItem (Join-Path $HOME "godot") -Filter "Godot*.exe" -File |
            Select-Object -First 1
          if (-not $GodotExe) { throw "setup-godot executable not found" }
          $env:JHT_GODOT_BIN = $GodotExe.FullName
          ./game/tools/run.ps1 test watch

      # L'export e' il passo piu' pesante e arriva per ultimo, dopo ~26
      # invocazioni di Godot nello stesso job. Ogni chiusura lascia risorse
      # ("N ObjectDB instances were leaked", "N resources still in use") e il
      # 2026-07-29 il runner Windows e' andato in **segfault** (exit 139) a
      # meta' impacchettamento — con tutti i test verdi appena sopra. Al
      # rilancio e' passato: intermittente, cioe' la specie peggiore, perche'
      # un rosso casuale rende inutile il semaforo di una release.
      #
      # `release.yml` non ha mai avuto il problema: la' l'export vive in un job
      # a se', su un runner fresco. Qui non possiamo separarlo senza spostare
      # anche i template di export, quindi si riparte da un processo pulito:
      # una pausa perche' il sistema operativo recuperi gli handle dei
      # processi appena usciti, e un solo ritentativo. Se serve il ritentativo
      # lo si vede nel log — se comincia a servire spesso, la separazione in
      # due job diventa obbligatoria e questo commento e' la traccia.
      - name: Export native release
        working-directory: game
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"
          sleep 5
          if ! godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"; then
            code=$?
            echo "::warning::export fallito (exit $code) — riprovo una volta su processo pulito"
            rm -f "${{ matrix.output }}"
            sleep 15
            godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          fi
          test -s "${{ matrix.output }}"

      - name: Smoke-test exported runtime
        working-directory: game
        run: |
          case "${{ runner.os }}" in
            Windows)
              JHT_NOVPS=1 "${{ matrix.output }}" --headless --quit-after 3
              ;;
            Linux)
              chmod +x "${{ matrix.output }}"
              JHT_NOVPS=1 "./${{ matrix.output }}" --headless --quit-after 3
              ;;
            macOS)
              mkdir -p builds/macos/unpacked
              ditto -x -k "${{ matrix.output }}" builds/macos/unpacked
              GAME_BIN="$(find builds/macos/unpacked -type f -path '*/Contents/MacOS/*' | head -n 1)"
              test -n "$GAME_BIN"
              JHT_NOVPS=1 "$GAME_BIN" --headless --quit-after 3
              ;;
          esac

      - name: Preserve Linux executable permissions
        if: runner.os == 'Linux'
        working-directory: game
        run: |
          tar -C builds/linux -czf builds/linux/job-hunter-team-linux-x64.tar.gz \
            job-hunter-team.x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}

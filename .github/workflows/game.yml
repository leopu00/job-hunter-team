name: Desktop — Tauri 2 distribution matrix

# Il nome del file resta game.yml per non spezzare link e automazioni storiche,
# ma il gate distributivo e' Tauri 2. game/ resta nel repository come legacy e
# non produce piu' gli artefatti pubblici.
on:
  push:
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/game.yml"
      - ".github/workflows/release.yml"
      - "scripts/check-release-version.sh"
  pull_request:
    branches:
      - master
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/game.yml"
      - ".github/workflows/release.yml"
      - "scripts/check-release-version.sh"
  workflow_dispatch:
    inputs:
      channel:
        description: "production (default) or test: a test build installs install.sh, compose, wrapper and image of this very commit"
        type: choice
        options:
          - production
          - test
        default: production
      runtime_image:
        description: "test only: runtime image of this commit, ghcr.io/leopu00/jht@sha256:<64 hex> (preferred) or ghcr.io/leopu00/jht:<tag>"
        type: string
        default: ""
      runtime_image_digest:
        description: "test only: sha256:<64 hex> of that image, from the docker.yml push; must match runtime_image when it is a digest"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-tauri:
    name: ${{ matrix.label }} — test and bundle Tauri 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            args: --bundles nsis
            artifact: tauri-windows-x64
          - os: macos-15
            label: macOS arm64
            args: --target aarch64-apple-darwin --bundles dmg --verbose
            artifact: tauri-macos-arm64
          - os: ubuntu-22.04
            label: Linux x64
            args: --bundles appimage,deb
            artifact: tauri-linux-x64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            shared/package-lock.json

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Prepare Rust targets
        run: |
          rustc --version
          cargo --version
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin
          fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: tauri-bundle-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: tauri-bundle-${{ runner.os }}-

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Il desktop importa shared/config/profile-schema.ts, che vuole `zod`:
      # zod e' dichiarato e bloccato in shared/, e senza le sue dipendenze
      # typecheck, vitest e build vite non risolvono l'import. In locale non si
      # vede: la radice del checkout ha gia' i suoi node_modules.
      - name: Install shared dependencies for imported modules
        working-directory: shared
        run: npm ci --ignore-scripts

      # Il vitest della desktop su Windows e macOS gira solo qui (test.yml lo
      # gira su Linux). `cargo test` invece non c'e' piu' (07/10): lo stesso
      # crate, sugli stessi tre sistemi, lo prova il job `desktop-rust` di
      # test.yml; qui costava 20-94 s per sistema (run 37553157589).
      # release.yml lo tiene: il rilascio non dipende da un altro workflow.
      - name: Run canonical desktop gates
        run: npm --prefix desktop test

      # Canale di test, solo a mano (workflow_dispatch, channel=test). L'app li
      # legge in build.rs al build: con JHT_CHANNEL=test scarica install.sh,
      # compose e wrapper di QUESTO commit e usa l'immagine indicata. Senza
      # canale le variabili non esistono proprio (non vuote): l'app resta
      # quella di produzione. Gli input passano solo per l'ambiente, mai
      # interpolati nello script.
      - name: Select the test channel
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'test'
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          RUNTIME_IMAGE_DIGEST: ${{ inputs.runtime_image_digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # [[ =~ ]] confronta la stringa intera: grep andrebbe riga per riga e
          # un a capo nell'input scriverebbe righe in piu' in GITHUB_ENV.
          image_re='^ghcr\.io/leopu00/jht(@sha256:[0-9a-f]{64}|:[A-Za-z0-9._-]{1,128})$'
          if ! [[ "$RUNTIME_IMAGE" =~ $image_re ]]; then
            echo "::error::channel=test needs runtime_image = ghcr.io/leopu00/jht@sha256:<64 hex> or ghcr.io/leopu00/jht:<tag>"
            exit 1
          fi
          if ! [[ "$RUNTIME_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::channel=test needs runtime_image_digest = sha256:<64 hex>"
            exit 1
          fi
          if [[ "$RUNTIME_IMAGE" == *@sha256:* && "${RUNTIME_IMAGE#*@}" != "$RUNTIME_IMAGE_DIGEST" ]]; then
            echo "::error::runtime_image and runtime_image_digest name two different digests"
            exit 1
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # python3 puo' mancare nella bash del runner Windows: sha256sum c'e'
          # nella Git Bash di Windows e su Linux, shasum su macOS.
          file_sha256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          install_sha256="$(file_sha256 scripts/install.sh)"
          install_ps1_sha256="$(file_sha256 scripts/install.ps1)"
          [[ "$install_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$install_ps1_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "JHT_CHANNEL=test"
            echo "JHT_SOURCE_SHA=$SOURCE_SHA"
            echo "JHT_RUNTIME_IMAGE=$RUNTIME_IMAGE"
            echo "JHT_RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST"
            echo "JHT_INSTALL_SHA256=$install_sha256"
            echo "JHT_INSTALL_PS1_SHA256=$install_ps1_sha256"
          } >> "$GITHUB_ENV"
          echo "test channel: source $SOURCE_SHA, image $RUNTIME_IMAGE ($RUNTIME_IMAGE_DIGEST), install.sh sha256 $install_sha256, install.ps1 sha256 $install_ps1_sha256"

      # La matrice di integrazione prova il packaging con firma ad-hoc su Mac.
      # Firma Developer ID e notarizzazione sono obbligatorie nel tag workflow.
      - name: Build Tauri bundles
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri:build -- ${{ matrix.args }}

      # La build Mac e' solo Apple silicon (arm64). Con `--bundles dmg` Tauri
      # cancella la .app dopo aver fatto il dmg, quindi si guarda il binario da
      # cui la .app e' stata costruita (Tauri lo stampa come «Built application at»).
      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        run: |
          binary=desktop/src-tauri/target/aarch64-apple-darwin/release/jht-desktop
          lipo -info "$binary"
          lipo "$binary" -verify_arch arm64

      # Quello che si installa e' la .app dentro il dmg: li' devono esserci
      # tutti e due i binari del crate, la shell e il compagno jht-existing-team,
      # eseguibili, arm64 e con la firma ad-hoc di questa matrice.
      - name: Gate macOS bundle — shell and companion shipped
        if: runner.os == 'macOS'
        run: python3 scripts/ci/verify_macos_bundle.py desktop/src-tauri/target/aarch64-apple-darwin/release/bundle --signature adhoc --require-dmg

      # Il passo che la 0.3.9 non aveva: il dmg si monta, l'app si copia fuori
      # come si trascina in Applicazioni, si avvia come la avvia il Finder e deve
      # mostrare la sua finestra. Il container no: il runner non puo' avviare una
      # macchina virtuale, e lo script lo dichiara (quello si prova su un Mac vero).
      - name: Install the DMG and open the app
        if: runner.os == 'macOS'
        run: |
          dmg="$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          python3 scripts/ci/smoke_macos_dmg.py "$dmg" --arch arm64 --timeout 120

      - name: Gate bundled Google login configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/verify-tauri-login-bundle.py --path desktop/dist

      # The NSIS setup as a person runs it, per user, here silent: what it
      # writes for «App e funzionalità», then its own uninstaller.
      # desktop/src-tauri/windows/installer-hooks.nsi is what it checks.
      - name: Install and uninstall the NSIS setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup not found' }
          $installed = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "setup exited $($installed.ExitCode)" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Job Hunter Team'
          $location = (Get-ItemProperty -LiteralPath $key).InstallLocation
          Write-Host "InstallLocation: $location"
          if ($location -match '"') { throw "InstallLocation is written in quotes: $location" }
          $uninstaller = Join-Path $location 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "no uninstaller in InstallLocation: $location" }
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          # The uninstaller copies itself and returns: wait for its entry to go.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path -LiteralPath $key) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path -LiteralPath $key) { throw 'the uninstaller left its entry in App e funzionalità' }

      # The app's uninstaller and the team (T72): installer-hooks.nsi runs
      # scripts/jht-uninstall-windows.ps1, shipped next to the app. For one user
      # Tauri installs the app in %LOCALAPPDATA%\Job Hunter Team, the folder that
      # also holds the team's host-runtime. Here, with the real setup:
      # - /S /UPDATE (the updater): nothing of the team touched, no report;
      # - /S with a host-runtime: the data and host-runtime stay (the template
      #   removes only its own files), the report is next to host-runtime;
      # - /S without one: the folder goes with the app, the report is in %TEMP%;
      # - what a Yes runs (-Mode Remove), then /S: the data goes, the documents
      #   stay, and the uninstaller still removes the app and its folder.
      - name: Uninstall with /UPDATE, /S and after a Yes, next to the team's data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Job Hunter Team'
          $jhtHome = Join-Path $env:USERPROFILE '.jht'
          $documents = Join-Path $env:USERPROFILE 'Documents\Job Hunter Team'
          $appData = @((Join-Path $env:APPDATA 'ai.jobhunterteam.desktop'), (Join-Path $env:LOCALAPPDATA 'ai.jobhunterteam.desktop'))
          $folders = @($jhtHome, $documents) + $appData
          $runtimeRoot = Join-Path $env:LOCALAPPDATA 'Job Hunter Team'
          $runtime = Join-Path $runtimeRoot 'host-runtime'
          $keepReport = Join-Path $runtimeRoot 'disinstallazione.txt'
          $tempReport = Join-Path ([IO.Path]::GetTempPath()) 'Job Hunter Team - disinstallazione.txt'
          foreach ($folder in $folders) {
            if (Test-Path -LiteralPath $folder) { throw "already there before the test: $folder" }
          }
          function New-PersonData {
            foreach ($folder in $folders) {
              New-Item -ItemType Directory -Force -Path $folder | Out-Null
              Set-Content -LiteralPath (Join-Path $folder 'data.txt') -Value 'the person''s data' -NoNewline
            }
          }
          function Assert-DataKept([string]$When, [string[]]$Which) {
            foreach ($folder in $Which) {
              $file = Join-Path $folder 'data.txt'
              if (-not (Test-Path -LiteralPath $file) -or (Get-Content -LiteralPath $file -Raw) -ne 'the person''s data') {
                throw "${When}: $file was touched"
              }
            }
          }
          function Install-App {
            Remove-Item -LiteralPath $tempReport -Force -ErrorAction SilentlyContinue
            $installed = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            if ($installed.ExitCode -ne 0) { throw "setup exited $($installed.ExitCode)" }
            $location = (Get-ItemProperty -LiteralPath $key).InstallLocation
            Write-Host "InstallLocation: $location"
            if (-not (Test-Path -LiteralPath (Join-Path $location 'jht-uninstall-windows.ps1') -PathType Leaf)) {
              throw "jht-uninstall-windows.ps1 is not next to the app: $location"
            }
            return $location
          }
          function Uninstall-App([string]$Arguments) {
            $location = (Get-ItemProperty -LiteralPath $key).InstallLocation
            Start-Process -FilePath (Join-Path $location 'uninstall.exe') -ArgumentList $Arguments -Wait | Out-Null
            # The uninstaller copies itself and returns: wait for its entry to go.
            $deadline = (Get-Date).AddSeconds(90)
            while ((Test-Path -LiteralPath $key) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
            if (Test-Path -LiteralPath $key) { throw "the uninstaller ($Arguments) left its entry" }
            if (@(Get-ChildItem -LiteralPath $location -Filter '*.exe' -ErrorAction SilentlyContinue).Count -gt 0) {
              throw "the uninstaller ($Arguments) left the app in $location"
            }
          }

          New-PersonData
          $location = Install-App
          Uninstall-App '/S /UPDATE'
          Assert-DataKept '/UPDATE' $folders
          if ((Test-Path -LiteralPath $tempReport) -or (Test-Path -LiteralPath $keepReport)) { throw '/UPDATE wrote the uninstall report' }

          $location = Install-App
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Set-Content -LiteralPath (Join-Path $runtime 'sentinel.txt') -Value 'host-runtime' -NoNewline
          Uninstall-App '/S'
          Assert-DataKept '/S with host-runtime' $folders
          if ((Get-Content -LiteralPath (Join-Path $runtime 'sentinel.txt') -Raw) -ne 'host-runtime') { throw '/S removed host-runtime' }
          if (-not (Test-Path -LiteralPath $keepReport)) { throw '/S with host-runtime wrote no report next to it' }
          $text = [IO.File]::ReadAllText($keepReport)
          Write-Host $text
          foreach ($named in @($runtime, $documents, $jhtHome)) {
            if (-not $text.Contains($named)) { throw "the report does not name $named" }
          }
          Remove-Item -LiteralPath $runtimeRoot -Recurse -Force

          $location = Install-App
          Uninstall-App '/S'
          Assert-DataKept '/S without host-runtime' $folders
          if (Test-Path -LiteralPath $runtimeRoot) { throw "/S left $runtimeRoot without a runtime in it" }
          if (Test-Path -LiteralPath $location) { throw "/S left the app's folder $location" }
          if (-not (Test-Path -LiteralPath $tempReport)) { throw '/S without host-runtime wrote no report in %TEMP%' }

          # What the hook runs after a Yes, with the shell it uses, then the uninstaller.
          $location = Install-App
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $location 'jht-uninstall-windows.ps1') -Mode Remove -Language en
          if ($LASTEXITCODE -ne 0) { throw "-Mode Remove exited $LASTEXITCODE" }
          foreach ($gone in @($jhtHome) + $appData) {
            if (Test-Path -LiteralPath $gone) { throw "-Mode Remove left $gone" }
          }
          Assert-DataKept '-Mode Remove' @($documents)
          if (-not (Test-Path -LiteralPath (Join-Path $location 'uninstall.exe'))) { throw '-Mode Remove took the app''s own files' }
          Uninstall-App '/S'
          if (Test-Path -LiteralPath $location) { throw "after a Yes the uninstaller left $location" }
          Remove-Item -LiteralPath $documents -Recurse -Force
          Remove-Item -LiteralPath $tempReport -Force -ErrorAction SilentlyContinue

      # Next to the v0.3.9 game (a stand-in with its uninstall entry, folder and
      # desktop shortcut): silent, the setup keeps it untouched and names its
      # own shortcuts «Job Hunter Team App»; its uninstaller removes only those.
      - name: Install and uninstall the NSIS setup next to the v0.3.9 game
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $gameKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\JobHunterTeam'
          $gameDir = Join-Path $env:LOCALAPPDATA 'Programs\Job Hunter Team'
          $desktop = [Environment]::GetFolderPath('Desktop')
          $programs = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          New-Item -ItemType Directory -Force -Path $gameDir, $desktop | Out-Null
          Set-Content -LiteralPath (Join-Path $gameDir 'Uninstall.exe') -Value 'stand-in, never run' -NoNewline
          $gameLink = Join-Path $desktop 'Job Hunter Team.lnk'
          Set-Content -LiteralPath $gameLink -Value 'the game shortcut' -NoNewline
          New-Item -Force -Path $gameKey | Out-Null
          Set-ItemProperty -Path $gameKey -Name DisplayName -Value 'Job Hunter Team'
          Set-ItemProperty -Path $gameKey -Name DisplayVersion -Value '0.3.9'
          Set-ItemProperty -Path $gameKey -Name InstallLocation -Value $gameDir
          Set-ItemProperty -Path $gameKey -Name UninstallString -Value "`"$gameDir\Uninstall.exe`""
          $before = (Get-FileHash -LiteralPath $gameLink).Hash
          function Assert-GameUntouched {
            if ((Get-FileHash -LiteralPath $gameLink).Hash -ne $before) { throw 'the game desktop shortcut was changed' }
            if (-not (Test-Path -LiteralPath $gameKey)) { throw 'the game uninstall entry is gone' }
            if (-not (Test-Path -LiteralPath (Join-Path $gameDir 'Uninstall.exe'))) { throw 'the game uninstaller is gone' }
          }

          $installed = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "setup exited $($installed.ExitCode)" }
          Assert-GameUntouched
          foreach ($link in @((Join-Path $desktop 'Job Hunter Team App.lnk'), (Join-Path $programs 'Job Hunter Team App.lnk'))) {
            if (-not (Test-Path -LiteralPath $link)) { throw "missing: $link" }
          }
          if (Test-Path -LiteralPath (Join-Path $programs 'Job Hunter Team.lnk')) { throw 'the app took the game Start menu name' }

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Job Hunter Team'
          $location = (Get-ItemProperty -LiteralPath $key).InstallLocation
          Start-Process -FilePath (Join-Path $location 'uninstall.exe') -ArgumentList '/S' -Wait | Out-Null
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path -LiteralPath $key) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path -LiteralPath $key) { throw 'the uninstaller left its entry' }
          Assert-GameUntouched
          foreach ($link in @((Join-Path $desktop 'Job Hunter Team App.lnk'), (Join-Path $programs 'Job Hunter Team App.lnk'))) {
            if (Test-Path -LiteralPath $link) { throw "left behind: $link" }
          }
          Remove-Item -LiteralPath $gameKey -Recurse -Force
          Remove-Item -LiteralPath $gameDir -Recurse -Force
          Remove-Item -LiteralPath $gameLink -Force

      - name: Collect bundle outputs
        run: |
          mkdir -p gate-assets
          find desktop/src-tauri/target -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} gate-assets/ \;
          test -n "$(find gate-assets -type f -print -quit)"
          if find gate-assets -type f -size 0 -print -quit | grep -q .; then exit 1; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}${{ env.JHT_CHANNEL == 'test' && '-test' || '' }}
          path: gate-assets/

name: Desktop — Tauri 2 distribution matrix

# Il nome del file resta game.yml per non spezzare link e automazioni storiche,
# ma il gate distributivo e' Tauri 2. game/ resta nel repository come legacy e
# non produce piu' gli artefatti pubblici.
on:
  push:
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/game.yml"
      - ".github/workflows/release.yml"
      - "scripts/check-release-version.sh"
  pull_request:
    branches:
      - master
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/game.yml"
      - ".github/workflows/release.yml"
      - "scripts/check-release-version.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    name: ${{ matrix.label }} — test and bundle Tauri 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            args: --bundles nsis
            artifact: tauri-windows-x64
          - os: macos-14
            label: macOS Universal 2
            args: --target universal-apple-darwin --bundles dmg
            artifact: tauri-macos-universal
          - os: ubuntu-22.04
            label: Linux x64
            args: --bundles appimage,deb
            artifact: tauri-linux-x64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Prepare Rust targets
        run: |
          rustc --version
          cargo --version
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: tauri-bundle-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: tauri-bundle-${{ runner.os }}-

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run canonical desktop gates
        run: |
          npm --prefix desktop test
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      # La matrice di integrazione prova il packaging con firma ad-hoc su Mac.
      # Firma Developer ID e notarizzazione sono obbligatorie nel tag workflow.
      - name: Build Tauri bundles
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Gate bundled Google login configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/verify-tauri-login-bundle.py --path desktop/dist

      - name: Collect bundle outputs
        run: |
          mkdir -p gate-assets
          find desktop/src-tauri/target -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} gate-assets/ \;
          test -n "$(find gate-assets -type f -print -quit)"
          find gate-assets -type f -size 0 -print -quit | grep -q . && exit 1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: gate-assets/

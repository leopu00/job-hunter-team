name: Desktop — Tauri 2 distribution matrix

# Il nome del file resta game.yml per non spezzare link e automazioni storiche,
# ma il gate distributivo e' Tauri 2. game/ resta nel repository come legacy e
# non produce piu' gli artefatti pubblici.
on:
  push:
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/game.yml"
      - ".github/workflows/release.yml"
      - "scripts/check-release-version.sh"
  pull_request:
    branches:
      - master
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/game.yml"
      - ".github/workflows/release.yml"
      - "scripts/check-release-version.sh"
  workflow_dispatch:
    inputs:
      channel:
        description: "production (default) or test: a test build installs install.sh, compose, wrapper and image of this very commit"
        type: choice
        options:
          - production
          - test
        default: production
      runtime_image:
        description: "test only: runtime image of this commit, ghcr.io/leopu00/jht@sha256:<64 hex> (preferred) or ghcr.io/leopu00/jht:<tag>"
        type: string
        default: ""
      runtime_image_digest:
        description: "test only: sha256:<64 hex> of that image, from the docker.yml push; must match runtime_image when it is a digest"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-tauri:
    name: ${{ matrix.label }} — test and bundle Tauri 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            args: --bundles nsis
            artifact: tauri-windows-x64
          - os: macos-14
            label: macOS Universal 2
            args: --target universal-apple-darwin --bundles dmg
            artifact: tauri-macos-universal
          - os: ubuntu-22.04
            label: Linux x64
            args: --bundles appimage,deb
            artifact: tauri-linux-x64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Prepare Rust targets
        run: |
          rustc --version
          cargo --version
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: tauri-bundle-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: tauri-bundle-${{ runner.os }}-

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Il vitest della desktop su Windows e macOS gira solo qui (test.yml lo
      # gira su Linux). `cargo test` invece non c'e' piu' (07/10): lo stesso
      # crate, sugli stessi tre sistemi, lo prova il job `desktop-rust` di
      # test.yml; qui costava 20-94 s per sistema (run 37553157589).
      # release.yml lo tiene: il rilascio non dipende da un altro workflow.
      - name: Run canonical desktop gates
        run: npm --prefix desktop test

      # Canale di test, solo a mano (workflow_dispatch, channel=test). L'app li
      # legge in build.rs al build: con JHT_CHANNEL=test scarica install.sh,
      # compose e wrapper di QUESTO commit e usa l'immagine indicata. Senza
      # canale le variabili non esistono proprio (non vuote): l'app resta
      # quella di produzione. Gli input passano solo per l'ambiente, mai
      # interpolati nello script.
      - name: Select the test channel
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'test'
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          RUNTIME_IMAGE_DIGEST: ${{ inputs.runtime_image_digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # [[ =~ ]] confronta la stringa intera: grep andrebbe riga per riga e
          # un a capo nell'input scriverebbe righe in piu' in GITHUB_ENV.
          image_re='^ghcr\.io/leopu00/jht(@sha256:[0-9a-f]{64}|:[A-Za-z0-9._-]{1,128})$'
          if ! [[ "$RUNTIME_IMAGE" =~ $image_re ]]; then
            echo "::error::channel=test needs runtime_image = ghcr.io/leopu00/jht@sha256:<64 hex> or ghcr.io/leopu00/jht:<tag>"
            exit 1
          fi
          if ! [[ "$RUNTIME_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::channel=test needs runtime_image_digest = sha256:<64 hex>"
            exit 1
          fi
          if [[ "$RUNTIME_IMAGE" == *@sha256:* && "${RUNTIME_IMAGE#*@}" != "$RUNTIME_IMAGE_DIGEST" ]]; then
            echo "::error::runtime_image and runtime_image_digest name two different digests"
            exit 1
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # python3 puo' mancare nella bash del runner Windows: sha256sum c'e'
          # nella Git Bash di Windows e su Linux, shasum su macOS.
          file_sha256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          install_sha256="$(file_sha256 scripts/install.sh)"
          install_ps1_sha256="$(file_sha256 scripts/install.ps1)"
          [[ "$install_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$install_ps1_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "JHT_CHANNEL=test"
            echo "JHT_SOURCE_SHA=$SOURCE_SHA"
            echo "JHT_RUNTIME_IMAGE=$RUNTIME_IMAGE"
            echo "JHT_RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST"
            echo "JHT_INSTALL_SHA256=$install_sha256"
            echo "JHT_INSTALL_PS1_SHA256=$install_ps1_sha256"
          } >> "$GITHUB_ENV"
          echo "test channel: source $SOURCE_SHA, image $RUNTIME_IMAGE ($RUNTIME_IMAGE_DIGEST), install.sh sha256 $install_sha256, install.ps1 sha256 $install_ps1_sha256"

      # La matrice di integrazione prova il packaging con firma ad-hoc su Mac.
      # Firma Developer ID e notarizzazione sono obbligatorie nel tag workflow.
      - name: Build Tauri bundles
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri:build -- ${{ matrix.args }}

      # Il bundle Universal 2 deve contenere entrambe le fette: un oggetto
      # nativo compilato per l'architettura dell'host viene scartato dal link
      # dell'altra fetta. Con `--bundles dmg` Tauri cancella la .app dopo aver
      # fatto il dmg, quindi si guarda il binario universale da cui la .app e'
      # stata costruita (Tauri lo stampa come «Built application at»).
      - name: Verify macOS universal binary slices
        if: runner.os == 'macOS'
        run: |
          binary=desktop/src-tauri/target/universal-apple-darwin/release/jht-desktop
          lipo -info "$binary"
          lipo "$binary" -verify_arch x86_64 arm64

      - name: Gate bundled Google login configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python scripts/verify-tauri-login-bundle.py --path desktop/dist

      - name: Collect bundle outputs
        run: |
          mkdir -p gate-assets
          find desktop/src-tauri/target -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} gate-assets/ \;
          test -n "$(find gate-assets -type f -print -quit)"
          find gate-assets -type f -size 0 -print -quit | grep -q . && exit 1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}${{ env.JHT_CHANNEL == 'test' && '-test' || '' }}
          path: gate-assets/

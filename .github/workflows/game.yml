name: Game — Native desktop matrix

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/game.yml"
  pull_request:
    branches:
      - master
    paths:
      - "game/**"
      - ".github/workflows/game.yml"
  workflow_dispatch:

jobs:
  test-export:
    name: ${{ matrix.label }} — test, export, smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            preset: Windows Desktop
            output: builds/windows/job-hunter-team.exe
            artifact: game-windows-x64
            artifact_path: game/builds/windows/job-hunter-team.exe
          - os: macos-14
            label: macOS Universal 2
            preset: macOS
            output: builds/macos/job-hunter-team.zip
            artifact: game-macos-universal
            artifact_path: game/builds/macos/job-hunter-team.zip
          - os: ubuntu-22.04
            label: Linux x64
            preset: Linux
            output: builds/linux/job-hunter-team.x86_64
            artifact: game-linux-x64
            artifact_path: game/builds/linux/job-hunter-team-linux-x64.tar.gz
    defaults:
      run:
        shell: bash
    env:
      JHT_NOVPS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Import and parse project
        run: godot --headless --path game --import

      - name: Run deterministic game tests
        if: runner.os != 'Windows'
        run: |
          godot --headless --path game --script res://tools/nav_grid_selftest.gd
          godot --headless --path game --script res://tools/speech_bubble_selftest.gd
          godot --headless --path game --script res://tools/pipeline_queue_selftest.gd
          godot --headless --path game --script res://tools/embedded_terminal_selftest.gd
          godot --headless --path game --script res://tools/redactor_selftest.gd
          godot --headless --path game --script res://tools/diagnostics_selftest.gd
          godot --headless --path game --script res://tools/theme_selftest.gd
          godot --headless --path game --script res://tools/budget_notice_selftest.gd
          # L'avviso della deroga alla spesa NOMINA i freni che non cedono e
          # il tetto di ore: sono copiati da shared/skills/burn_intent.py, e
          # una copia che resta indietro promette reti di sicurezza che il
          # modulo non ha piu'. Questo test confronta la copia col sorgente.
          godot --headless --path game --script res://tools/burn_mode_selftest.gd
          godot --headless --path game --script res://tools/doc_preview_selftest.gd
          # La terza via all'uscita ("esci, il team continua") e l'attesa del
          # thread di spegnimento. Nessuna delle due si vede a schermo: si
          # sbagliano in silenzio e si scoprono la mattina dopo, dal lavoro
          # non fatto o dal container rimasto acceso tutta la notte.
          godot --headless --path game --script res://tools/headless_exit_selftest.gd
          # L'aggiornamento automatico. Si sbaglia in tre modi che a schermo si
          # assomigliano tutti a "non succede niente": non avvisare mai,
          # proporre un DECLASSAMENTO (alfabeticamente "0.3.10" viene prima di
          # "0.3.9"), o installare un pacchetto firmato da qualcun altro —
          # perche' la notarizzazione dice che Apple lo ha esaminato, non che
          # e' il nostro. Nessuno dei tre si vede in un test manuale: il primo
          # e l'ultimo si scoprirebbero da un utente.
          godot --headless --path game --script res://tools/update_check_selftest.gd
          # /bin/sh: solo POSIX, ed e' il motivo per cui non e' in run.ps1.
          godot --headless --path game --script res://tools/terminal_selection_selftest.gd
          # Il guard delle 7 lingue. UIStrings.t() fa fallback SILENZIOSO
          # sull'italiano e i dizionari tradotti si caricano pigramente:
          # senza questa riga sedici chiavi duplicate in ui_en.gd passavano
          # in verde e rompevano l'avvio in tutte le lingue tranne una.
          godot --headless --path game --script res://tools/i18n_parity_selftest.gd
          # Il patto del riordino della sidebar: le voci raccolte in schede o
          # dietro "Impostazioni" restano raggiungibili e tradotte. Una sezione
          # caduta da tutti gli elenchi non fa rumore, semplicemente sparisce.
          godot --headless --path game --script res://tools/sidebar_nav_selftest.gd
          # I cognomi degli agenti. Sono identita', non decorazione: se la
          # mappa ruolo+numero smettesse di essere una funzione pura, "scout-2"
          # cambierebbe nome fra un riavvio e l'altro senza che nulla si
          # rompa. Il test tiene fermi determinismo, assenza di omonimi,
          # fallback oltre la lista e — cosa che a schermo si vedrebbe solo
          # come un rettangolo vuoto — che ogni carattere di ogni cognome
          # esista gia' nei dizionari delle 7 lingue.
          godot --headless --path game --script res://tools/agent_names_selftest.gd
          # Il costo a riposo: la finestra senza focus deve disegnare di meno,
          # ma il tetto fps del primo piano va restituito ALLA LETTERA (chi ha
          # il profilo ridotto gira a 30, non a 60) e a ritmo lento i passi di
          # fisica devono coprire il frame, altrimenti il motore butta il tempo
          # in eccesso e la scena rallenta davvero.
          godot --headless --path game --script res://tools/idle_pace_selftest.gd
          VPS_OUT="$(JHT_VPS_CONTRACT_TEST=1 godot --headless --path game --quit-after 3 2>&1)"
          printf '%s\n' "$VPS_OUT" | grep "VPS-CONTRACT-TEST PASS"
          PIPE_OUT="$(JHT_SCENE=office JHT_PIPELINE_FORCE_TEST=scout godot --headless --path game 2>&1)"
          printf '%s\n' "$PIPE_OUT" | grep "PIPELINE-FORCE-TEST PASS"
          SWITCH_OUT="$(JHT_SCENE=office JHT_BACKEND_SWITCH_TEST=1 godot --headless --path game 2>&1)"
          printf '%s\n' "$SWITCH_OUT" | grep "BACKEND-SWITCH-TEST PASS"
          DOCTOR_OUT="$(JHT_SCENE=office JHT_DOCTOR_TEST=scout-4 godot --headless --path game 2>&1)"
          printf '%s\n' "$DOCTOR_OUT" | grep "SIMULATION-DOCTOR-TEST PASS"
          FEEDBACK_OUT="$(JHT_SCENE=office JHT_FEEDBACK_PANEL_TEST=1 godot --headless --path game 2>&1)"
          printf '%s\n' "$FEEDBACK_OUT" | grep "FEEDBACK-PANEL-TEST PASS"
          GUIDED_OUT="$(JHT_SCENE=office JHT_GUIDED_TEST=1 godot --headless --path game 2>&1)"
          printf '%s\n' "$GUIDED_OUT" | grep "GUIDED-ONBOARDING-TEST PASS"
          # La pagina di chat a fumetti: che le vignette esistano, siano
          # nell'ordine della storia, che quella dell'agente resti bianca col
          # testo nero (e' una richiesta esplicita, non una scelta di tema) con
          # la coda verso il suo ritratto e quella dell'utente dalla parte
          # opposta, che il giro utente->canale->risposta passi davvero dal bus
          # con un ruolo OPERATIVO, e che rileggere indietro non venga
          # interrotto dal messaggio successivo.
          COMIC_OUT="$(JHT_SCENE=office JHT_COMIC_CHAT_TEST=1 godot --headless --path game 2>&1)"
          printf '%s\n' "$COMIC_OUT" | grep "COMIC-CHAT-TEST PASS"
          GFX_OUT="$(JHT_SCENE=office JHT_GFX_TEST=1 godot --headless --path game 2>&1)"
          printf '%s\n' "$GFX_OUT" | grep "GFX-PROFILE-TEST PASS"
          TEXT_OUT="$(JHT_SCENE=office JHT_WORLD_TEXT_TEST=1 godot --headless --path game 2>&1)"
          printf '%s\n' "$TEXT_OUT" | grep "WORLD-TEXT-TEST PASS"
          GFXPANEL_OUT="$(JHT_SCENE=office JHT_GRAPHICS_PANEL_TEST=1 godot --headless --path game 2>&1)"
          printf '%s\n' "$GFXPANEL_OUT" | grep "GRAPHICS-PANEL-TEST PASS"

      - name: Run deterministic game tests through PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $GodotExe = Get-ChildItem (Join-Path $HOME "godot") -Filter "Godot*.exe" -File |
            Select-Object -First 1
          if (-not $GodotExe) { throw "setup-godot executable not found" }
          $env:JHT_GODOT_BIN = $GodotExe.FullName
          ./game/tools/run.ps1 test

      - name: Export native release
        working-directory: game
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Smoke-test exported runtime
        working-directory: game
        run: |
          case "${{ runner.os }}" in
            Windows)
              JHT_NOVPS=1 "${{ matrix.output }}" --headless --quit-after 3
              ;;
            Linux)
              chmod +x "${{ matrix.output }}"
              JHT_NOVPS=1 "./${{ matrix.output }}" --headless --quit-after 3
              ;;
            macOS)
              mkdir -p builds/macos/unpacked
              ditto -x -k "${{ matrix.output }}" builds/macos/unpacked
              GAME_BIN="$(find builds/macos/unpacked -type f -path '*/Contents/MacOS/*' | head -n 1)"
              test -n "$GAME_BIN"
              JHT_NOVPS=1 "$GAME_BIN" --headless --quit-after 3
              ;;
          esac

      - name: Preserve Linux executable permissions
        if: runner.os == 'Linux'
        working-directory: game
        run: |
          tar -C builds/linux -czf builds/linux/job-hunter-team-linux-x64.tar.gz \
            job-hunter-team.x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}

name: Broker — Chromium sandbox

# Design R3, way (a): the login browser in the jht-broker container runs only
# with Chromium's own sandbox, under the host's jht-broker profiles
# (scripts/security). This job measures it on a real Linux with AppArmor's
# restriction of unprivileged user namespaces ON (it is never lowered here),
# and checks the fail-closed path without the profiles. It also stands for
# the Podman plan's AppArmor risk (signal and ptrace DENIED in the journal).

on:
  push:
    branches:
      - master
      - master-arthur
      # The integrator's trial branches: a job that never ran is proved on
      # one of them before it reaches master-arthur. A workflow_dispatch
      # cannot do it, as long as this file is not on the default branch.
      - "ci-**"
    paths:
      - "Dockerfile"
      - "shared/broker/**"
      - "scripts/security/**"
      - "scripts/ci/broker_sandbox.py"
      - "scripts/ci/broker_sandbox_podman.py"
      - "scripts/ci/compat32_gate.py"
      - "scripts/ci/compat32_socket.c.txt"
      - "scripts/ci/broker_security_host.sh"
      - "scripts/install.sh"
      - "scripts/jht-wrapper.sh"
      - ".github/workflows/broker-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-sandbox:
    name: Chromium sandbox under the jht-broker profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image (amd64, local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: jht:broker-sandbox
          cache-from: type=gha

      - name: Load the jht-broker AppArmor profile
        run: |
          sudo apparmor_parser --version | head -1
          sudo cp scripts/security/jht-broker.apparmor.txt /etc/apparmor.d/jht-broker
          sudo apparmor_parser -r /etc/apparmor.d/jht-broker
          sudo grep -x 'jht-broker (enforce)' /sys/kernel/security/apparmor/profiles
          # The journal control: a profile without userns, for the job only.
          sudo cp scripts/ci/jht-journal-control.apparmor.txt /etc/apparmor.d/jht-journal-control
          sudo apparmor_parser -r /etc/apparmor.d/jht-journal-control
          sudo grep -x 'jht-journal-control (enforce)' /sys/kernel/security/apparmor/profiles

      - name: Chromium's sandbox runs, and the broker fails closed without the profiles
        run: python3 scripts/ci/broker_sandbox.py jht:broker-sandbox scripts/security/jht-broker.seccomp.json

      - name: install.sh installs the profiles, and jht up adds them only when loaded
        run: bash scripts/ci/broker_security_host.sh

      - name: Build the 32-bit probe (i386, static, no libc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib
          gcc -m32 -static -nostdlib -ffreestanding -fno-pie -no-pie -fno-stack-protector -O1 \
            -o "$RUNNER_TEMP/compat32" -x c scripts/ci/compat32_socket.c.txt
          file "$RUNNER_TEMP/compat32"

      - name: 32-bit code opens no AF_ALG or AF_VSOCK under the profile, and the image has no 32-bit Chromium or Python
        run: >-
          python3 scripts/ci/compat32_gate.py docker scripts/security/jht-broker.seccomp.json "$RUNNER_TEMP/compat32"
          --image-check jht:broker-sandbox

  # the security review's decision (a), 09/10: under rootless Podman (stage 1 of the
  # Podman plan) no AppArmor profile applies, and the broker runs with the
  # seccomp profile alone, accepted only in a verified rootless container.
  # This job is that decision's gate: the broker ready and Chromium
  # sandboxed under rootless Podman, the counter-proofs from the broker's
  # Python, and a rootful container without the label that must stay off.
  broker-sandbox-podman:
    name: The broker under rootless Podman, seccomp only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image (amd64, local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: jht:broker-sandbox
          cache-from: type=gha

      - name: Hand the image to the runner user's rootless Podman
        run: |
          echo "MEASURE apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          grep "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          podman system migrate
          docker save jht:broker-sandbox | podman load | tee "$RUNNER_TEMP/loaded.txt"
          sed -n 's/^Loaded image[s()]*: //p' "$RUNNER_TEMP/loaded.txt" | head -n 1 > "$RUNNER_TEMP/image-ref"
          test -s "$RUNNER_TEMP/image-ref"

      - name: Rootless Podman runs the broker confined and Chromium sandboxed; rootful without the label stays off
        run: >-
          python3 scripts/ci/broker_sandbox_podman.py "$(cat "$RUNNER_TEMP/image-ref")" jht:broker-sandbox
          scripts/security/jht-broker.seccomp.json

      - name: Build the 32-bit probe (i386, static, no libc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib
          gcc -m32 -static -nostdlib -ffreestanding -fno-pie -no-pie -fno-stack-protector -O1 \
            -o "$RUNNER_TEMP/compat32" -x c scripts/ci/compat32_socket.c.txt
          file "$RUNNER_TEMP/compat32"

      - name: 32-bit code opens no AF_ALG or AF_VSOCK under rootless Podman with the profile
        run: python3 scripts/ci/compat32_gate.py podman scripts/security/jht-broker.seccomp.json "$RUNNER_TEMP/compat32"

  # The same 32-bit hole on arm64 (AArch32 code), where the broker runs on
  # Apple Silicon and on ARM VPSs. qemu-user would prove nothing: it turns
  # 32-bit calls into the host's 64-bit ones before seccomp sees them. A
  # native arm64 runner; if its CPU runs no AArch32 code, the gate says so.
  broker-seccomp-compat32-arm:
    name: 32-bit ARM code against the broker's seccomp profile (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the 32-bit probe (armhf, static, no libc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc -marm -static -nostdlib -ffreestanding -fno-pie -no-pie -fno-stack-protector -O1 \
            -o "$RUNNER_TEMP/compat32" -x c scripts/ci/compat32_socket.c.txt
          file "$RUNNER_TEMP/compat32"

      - name: Under Docker
        run: python3 scripts/ci/compat32_gate.py docker scripts/security/jht-broker.seccomp.json "$RUNNER_TEMP/compat32"

      - name: Under rootless Podman
        run: |
          grep "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          podman system migrate
          python3 scripts/ci/compat32_gate.py podman scripts/security/jht-broker.seccomp.json "$RUNNER_TEMP/compat32"

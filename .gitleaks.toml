# gitleaks: the default rules, plus narrow exclusions verified by hand.
#
# Written for gitleaks 8.24.3, the version gitleaks-action@v3 installs:
# it silently ignores a top-level [[allowlists]] array (that arrived in
# 8.25), so the global table is the singular [allowlist]. 8.30 reads both
# forms. Single findings in real code are pinned below to their rule,
# commit AND path, as narrow as a .gitleaksignore fingerprint: new
# commits are never covered. Never a whole rule, a regex or a glob like
# **/*.test.ts: they would hide the next real leak.

[extend]
useDefault = true

# Files whose whole job is to hold fake secrets.
[allowlist]
description = "Fixtures with fake secrets and the detect-secrets baseline, verified by hand 05/10/2026"
paths = [
  # detect-secrets baseline: hashed fingerprints of its own findings
  '''^\.secrets\.baseline$''',
  # tests that mask or write made-up tokens, JWTs and secret files
  '''^tests/js/validators/redact\.test\.ts$''',
  '''^shared/logger/redact\.smoke\.ts$''',
  '''^game/tools/redactor_selftest\.gd$''',
  '''^game/tools/embedded_terminal_selftest\.gd$''',
  '''^agent-harness/runtime/tests/render-pdf\.test\.ts$''',
  # config schema test: placeholder api_key values
  '''^tests/js/config/schema\.test\.ts$''',
  # vitest task list: test titles, not values
  '''^tests/js/\.vitest-tasks\.json$''',
]

# The Supabase anon key: role=anon, public by design, shipped to every
# client. Each occurrence decoded and checked 05/10/2026, no service_role.
[[rules]]
id = "jwt"

[[rules.allowlists]]
description = "Supabase anon key"
condition = "AND"
commits = ["0034c621ffad586a4057a9419d4e88b8ce292840", "ae46cb654fb93cbeb623d9229dc4c7872031ddfc"]
paths = ['''^web/lib/supabase/config\.ts$''']

[[rules.allowlists]]
description = "Supabase anon key"
condition = "AND"
commits = ["2001b60cfebea4cdc15e6ef27277228529a0b987", "3f396f2efa434879888794fe751a70ee041dc6b2"]
paths = ['''^desktop/auth/supabase-client\.js$''']

[[rules.allowlists]]
description = "Supabase anon key"
condition = "AND"
commits = ["2c99901289ee63988c513eecf856cd508c41e99e"]
paths = ['''^archive/electron-desktop/auth/supabase-client\.js$''']

[[rules.allowlists]]

# Podman-on-Windows compatibility override.
#
# The agent container uses host networking for compatibility with Podman
# Machine 6 / Netavark 2, whose custom rootless bridge can fail while applying
# nftables rules. Isolated services remain on a bridge and do not join the
# agent's host network namespace.

services:
  jht:
    # Rootless Podman otherwise maps the image user to a subordinate host UID.
    # keep-id is required for the owner-only Windows ACL on ~/.jht: the jht
    # process must reach the bind mount as the Podman machine user (UID 1000).
    userns_mode: "keep-id:uid=1001,gid=1001"
    network_mode: host
    # Host networking puts the container on the host's own interfaces: the
    # live-screen port of the base file cannot be published (Compose rejects
    # ports with network_mode host), and the stream must bind loopback itself —
    # the 0.0.0.0 default of .launcher/live-screen.sh would be every interface
    # of the machine here.
    ports: !reset []
    environment:
      - JHT_LIVE_SCREEN_BIND=127.0.0.1
      - JHT_LIVE_SCREEN_PORT=${JHT_LIVE_SCREEN_PORT:-6080}
      - HTTP_PROXY=${JHT_PODMAN_HTTP_PROXY:-}
      - HTTPS_PROXY=${JHT_PODMAN_HTTPS_PROXY:-}
      - ALL_PROXY=${JHT_PODMAN_ALL_PROXY:-}
      - NO_PROXY=${JHT_PODMAN_NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,host.containers.internal}
      - http_proxy=${JHT_PODMAN_HTTP_PROXY:-}
      - https_proxy=${JHT_PODMAN_HTTPS_PROXY:-}
      - all_proxy=${JHT_PODMAN_ALL_PROXY:-}
      - no_proxy=${JHT_PODMAN_NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,host.containers.internal}

  # Broker dei segreti dei portali (P1 del 08/10). Stessa mappa degli uid di
  # `jht`: con mappe diverse il broker vedrebbe il client degli agenti con un
  # uid rimappato in SO_PEERCRED e lo rifiuterebbe. Con questa, l'uid 1001 del
  # client resta 1001 anche per il broker, e il broker (1002) cade in un subuid
  # che non e' l'utente dell'host. NIENTE `network_mode: host`: il broker non
  # condivide il loopback con gli agenti.
  jht-broker:
    userns_mode: "keep-id:uid=1001,gid=1001"

  jht-telegram:
    # SO_PEERCRED è tradotto nel namespace del server. Client e server devono
    # quindi usare la stessa mappa: uid 1001 deve restare 1001 su entrambi.
    userns_mode: "keep-id:uid=1001,gid=1001"

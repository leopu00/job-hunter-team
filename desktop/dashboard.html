<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060608" />
    <title>Job Hunter Team</title>
    <script>
      (() => {
        const allowed = ["dark", "light", "graphite", "ocean", "paper"];
        let theme = "dark";
        try {
          const stored = localStorage.getItem("jht-desktop-theme");
          if (allowed.includes(stored)) theme = stored;
        } catch {}
        document.documentElement.dataset.jhtTheme = theme;
        document.documentElement.dataset.theme = theme === "light" || theme === "paper" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dashboard/main.tsx"></script>
  </body>
</html>

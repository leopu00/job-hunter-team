<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060608" />
    <title>Job Hunter Team</title>
    <script>
      (() => {
        // The same table as src/shell/theme.ts (a test runs this script against it).
        const families = { dark: "dark", light: "light", graphite: "dark", ocean: "dark", paper: "light", midnight: "dark", forest: "dark", dusk: "dark", contrast: "dark", sage: "light", lavender: "light" };
        let theme;
        try {
          const stored = localStorage.getItem("jht-desktop-theme");
          if (Object.prototype.hasOwnProperty.call(families, stored)) theme = stored;
        } catch {}
        if (!theme) {
          // Nothing valid chosen, or «follow the system»: the system's light or dark.
          let light = false;
          try {
            light = window.matchMedia("(prefers-color-scheme: light)").matches === true;
          } catch {}
          theme = light ? "light" : "dark";
        }
        document.documentElement.dataset.jhtTheme = theme;
        document.documentElement.dataset.theme = families[theme];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dashboard/main.tsx"></script>
  </body>
</html>

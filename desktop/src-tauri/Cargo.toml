[package]
name = "jht-desktop"
version = "0.1.0"
description = "Job Hunter Team desktop shell"
authors = ["Leone Emanuel Puglisi"]
edition = "2021"

[lib]
name = "jht_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
zeroize = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

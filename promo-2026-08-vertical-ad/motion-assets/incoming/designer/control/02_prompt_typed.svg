<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Typed Job Hunter Team chat prompt</title>
  <desc id="desc">Isolated game-style typed prompt layer for a declared motion collage, not a gameplay mockup.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-20%" width="116%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#111116" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="8" y="8" width="904" height="284" rx="22" fill="#F6F7F4" stroke="#111116" stroke-width="2"/>
    <rect x="34" y="46" width="58" height="6" rx="3" fill="#00E87A"/>
    <text x="112" y="59" fill="#111116" font-family="JetBrains Mono" font-size="28" font-weight="800" letter-spacing="1.4">CONTROL / LIVE ORDER</text>
    <rect x="34" y="92" width="650" height="158" rx="14" fill="#FFFFFF" stroke="#111116" stroke-width="2"/>
    <text x="62" y="158" fill="#111116" font-family="JetBrains Mono" font-size="58" font-weight="700">Show me the best</text>
    <text x="62" y="224" fill="#111116" font-family="JetBrains Mono" font-size="58" font-weight="700">one first.</text>
    <rect x="382" y="179" width="6" height="52" rx="3" fill="#00E87A"/>
    <rect x="706" y="92" width="180" height="158" rx="14" fill="#F6F7F4" stroke="#111116" stroke-width="2"/>
    <rect x="706" y="212" width="180" height="8" fill="#00E87A"/>
    <text x="796" y="190" text-anchor="middle" fill="#111116" font-family="JetBrains Mono" font-size="58" font-weight="800" letter-spacing="1">SEND</text>
  </g>
</svg>
